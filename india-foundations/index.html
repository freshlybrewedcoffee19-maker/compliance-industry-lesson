/* =====================================================================

 * Lessons and the library open light (data-theme="light" on <html>)

 * prefers-color-scheme: light switches it.

@import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap");

:root {
  /* dark = the GrowthX community palette: 900 greys, not pure black */
  --bg: #171717;
  --bg-2: #1c1c1e;
  --fg: #f5f5f5;
  --muted: #9ca3af;
  --card: #222529;
  --card-2: #2a2d32;
  --hairline: rgba(255, 255, 255, 0.1);
  --hairline-2: rgba(255, 255, 255, 0.18);
  --glass: rgba(255, 255, 255, 0.04);
  --glass-2: rgba(255, 255, 255, 0.1);

  --g1: #f5f5f5;
  /* dark gets its own brand shades: fills behind white text stay deep,
     text and icons on grey go lighter so both pass WCAG AA */
  --g2: #9f7fff;
  --g3: #5c9dff;
  --brand: #1f66f0;
  --brand-text: #5c9dff;
  --brand-fg: #ffffff;
  --violet: #a78bfa;
  --green: #5cc98a;
  --green-bg: rgba(92, 201, 138, 0.12);
  --red: #f0705c;
  --red-bg: rgba(240, 112, 92, 0.12);
  --amber: #e8a838;
  --amber-bg: rgba(232, 168, 56, 0.12);

  --code-bg: #1c1c1e;
  --code-fg: #d1d5db;

  --hero-glow:
    radial-gradient(1100px 560px at 15% -10%, rgba(86, 30, 255, 0.14), transparent 60%),
    radial-gradient(900px 480px at 90% 0%, rgba(0, 100, 255, 0.1), transparent 60%);

  --sans: "Gilroy", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;

  --radius: 12px;
  --radius-sm: 8px;
  --radius-pill: 100px;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fafafa;
    --bg-2: #ffffff;
    --fg: hsl(0 0% 9%);

    --card: #ffffff;

    --hairline: rgba(0, 0, 0, 0.08);
    --hairline-2: rgba(0, 0, 0, 0.16);
    --glass: rgba(0, 0, 0, 0.03);
    --glass-2: rgba(0, 0, 0, 0.06);
    --g1: #18181b;
    --g2: #561eff;
    --g3: #0064ff;
    --brand: #0064ff;
    --brand-text: #0057e0;
    --violet: #6d28d9;
    --green: #137537;
    --green-bg: rgba(22, 163, 74, 0.08);
    --red: #b33a0a;
    --red-bg: rgba(220, 38, 38, 0.07);
    --amber: #a14a08;
    --amber-bg: rgba(217, 119, 6, 0.08);
    --code-bg: #f4f4f6;
    --code-fg: #1f2937;
    --hero-glow:
      radial-gradient(1100px 560px at 15% -10%, rgba(86, 30, 255, 0.08), transparent 60%),
      radial-gradient(900px 480px at 90% 0%, rgba(0, 100, 255, 0.06), transparent 60%);
    color-scheme: light;
  }
}

.anim {

  --bg-2: #ffffff;
  --fg: hsl(0 0% 9%);

  --red-bg: rgba(220, 38, 38, 0.07);
  --amber: #a14a08;
  --amber-bg: rgba(217, 119, 6, 0.08);
  --code-bg: #f4f4f6;
  --code-fg: #1f2937;
  --hero-glow:
    radial-gradient(1100px 560px at 15% -10%, rgba(86, 30, 255, 0.08), transparent 60%),

/* =====================================================================
 * GrowthX teach base styles: layout and components.
 * Ships with the skill and updates with it. Colours and fonts come from
 * the tokens in theme.css.
 * ===================================================================== */

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  margin: 0;
  background: var(--bg);
  background-image: var(--hero-glow);
  background-repeat: no-repeat;
  color: var(--fg);
  font: 400 16px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-text, var(--brand)); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--glass-2); padding: 1px 6px; border-radius: 5px; }
strong { font-weight: 650; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 20px; }
.eyebrow { font: 500 11px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.serif { font-family: var(--serif); font-weight: 400; }
.grad {
  font-family: var(--serif); font-style: italic; font-weight: 400;
  background: linear-gradient(100deg, var(--g1), var(--g2) 55%, var(--g3));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  padding-right: 0.06em;
}

/* ===== Top bar ===== */
.progress { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 30; background: transparent; }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--g2), var(--g3)); transition: width 0.1s linear; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hairline);
}
/* On a lesson the bar lines up with the sidebar and content below it. */
.topbar .wrap.topbar-lesson { max-width: 1080px; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 7px; text-decoration: none; font-weight: 700; letter-spacing: -0.01em; }
.brand .grad { font-size: 1.15em; line-height: 1; }
.brand-logo { display: block; height: 22px; width: auto; color: #000; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-logo { color: #fff; } }
:root[data-theme="dark"] .brand-logo { color: #fff; }
/* The X mark's own blue is too faint on a light page; deepen it there only. */
.brand-logo [fill="#3096FF"] { fill: #1a7fe6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-logo [fill="#3096FF"] { fill: #3096ff; } }
:root[data-theme="dark"] .brand-logo [fill="#3096FF"] { fill: #3096ff; }
.controls { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--hairline-2); border-radius: var(--radius-pill); padding: 2px; background: var(--glass); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: var(--radius-pill); cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.icon-btn { border: 1px solid var(--hairline-2); background: var(--glass); border-radius: var(--radius-pill); width: 32px; height: 32px; cursor: pointer; }

/* ===== Lesson layout: sidebar + content ===== */
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 40px; max-width: 1080px; align-items: start; }
.content { min-width: 0; }
.sidebar { position: sticky; top: calc(var(--topbar-h, 52px) + 16px); padding-block: 40px 24px; display: grid; gap: 10px; max-height: calc(100vh - var(--topbar-h, 52px) - 16px); overflow-y: auto; }
.sidebar ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm); text-decoration: none; color: var(--muted); font-size: 14px; line-height: 1.35; }
.sidebar a:hover { background: var(--glass); color: var(--fg); }
.sidebar a.active { background: var(--glass-2); color: var(--fg); font-weight: 600; }
.sidebar .tick {
  flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--hairline-2);
  display: inline-grid; place-items: center; font: 500 10.5px var(--mono); color: var(--muted);
}
.sidebar a.active .tick { border-color: var(--brand-text, var(--brand)); color: var(--brand-text, var(--brand)); }
.sidebar a.done .tick { background: var(--brand); border-color: var(--brand); color: transparent; position: relative; }
.sidebar a.done .tick::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--brand-fg); font-size: 11px; }
.side-title { padding-left: 10px; }

.in-work { border: 1px solid color-mix(in srgb, var(--brand) 45%, transparent); background: color-mix(in srgb, var(--brand) 7%, var(--card)); border-radius: var(--radius-sm); padding: 12px 16px; display: grid; gap: 4px; }
.in-work .eyebrow { color: var(--brand-text, var(--brand)); }

/* ===== Hero ===== */
.hero { padding-block: 56px 28px; display: grid; gap: 18px; }
.hero h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 700; letter-spacing: -0.025em; }
.lede { font-size: 19px; color: var(--muted); max-width: 62ch; }
.goal { border: 1px solid var(--hairline-2); background: var(--glass); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 4px; }
.goal p { font-size: 17px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-block; text-decoration: none; font-size: 13px; border: 1px solid var(--hairline-2); border-radius: var(--radius-pill); padding: 5px 12px; background: var(--glass); }
.pill:hover { background: var(--glass-2); }

/* ===== Sections ===== */
section.block { padding-block: 40px; border-top: 1px solid var(--hairline); display: grid; gap: 20px; }
.sec-head { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.session-about { font-size: 19px; font-weight: 600; line-height: 1.45; }
.session-learn { border: 1px solid var(--hairline-2); background: var(--glass); border-radius: var(--radius); padding: 14px 18px; display: grid; gap: 8px; }
.session-learn ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.session-learn li::marker { color: var(--brand-text, var(--brand)); }
.session-learn a { color: var(--fg); text-decoration-color: color-mix(in srgb, var(--brand) 50%, transparent); text-underline-offset: 3px; }
.sec-num { font: 500 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-text, var(--brand)); }
.concept-head { flex-wrap: wrap; row-gap: 4px; }
.concept-label { font: 500 13px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-text, var(--brand)); white-space: nowrap; }
.definition { font-size: 17.5px; line-height: 1.7; }

/* ===== Concept: story → analogy → animation ===== */
.story { font-size: 18px; line-height: 1.7; color: var(--fg); }
.analogy {
  border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
  background: color-mix(in srgb, var(--amber) 9%, var(--card));
  border-radius: var(--radius); padding: 16px 20px; display: grid; gap: 6px;
}
.analogy .eyebrow { color: var(--amber); }
.analogy .prose { font-size: 17px; line-height: 1.7; }
/* ===== Animated figures =====
   Anything with data-beat starts faint and comes on when the player reaches
   its beat (.on); the beat being played is .now. .still is the finished
   picture, shown when motion is turned off. */
.anim {
  color: var(--fg); margin: 0; border: 1px solid var(--hairline); border-radius: var(--radius); padding: 16px 18px 18px;
  background-color: var(--bg-2);
  background-image: radial-gradient(color-mix(in srgb, var(--fg) 10%, transparent) 1px, transparent 1.2px);
  background-size: 18px 18px; display: grid; gap: 14px; font-size: 14.5px; line-height: 1.4;
}
.anim-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.anim-head strong { font-weight: 650; }
.anim-btn {
  flex: none; font: 500 12px var(--mono); color: var(--muted); background: var(--card); cursor: pointer;
  border: 1px solid var(--hairline-2); border-radius: var(--radius-pill); padding: 4px 10px;
}
.anim-btn:hover { color: var(--fg); }
.anim figcaption { color: var(--muted); text-align: center; text-wrap: balance; max-width: 60ch; justify-self: center; }
.anim-alt { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.anim [data-beat] { transition: opacity 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, background-color 0.35s ease, transform 0.35s ease; }

/* flow: steps light up one after another */
.af { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 26px; }
.af li {
  position: relative; display: grid; gap: 4px; align-content: start; min-width: 0; opacity: 0.32;
  border: 1.5px solid var(--hairline-2); border-radius: 10px; background: var(--card); padding: 12px 12px 12px;
}
.af li.on { opacity: 1; }
.af li.now { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
.af-n { font: 500 11px var(--mono); color: var(--brand-text, var(--brand)); }
.af li > span:last-child { color: var(--muted); }
.af li:not(:last-child)::after {
  content: "→"; position: absolute; right: -21px; top: 50%; transform: translateY(-50%);
  color: var(--muted); opacity: 0.35; transition: opacity 0.35s ease, color 0.35s ease;
}
.af li.on:not(:last-child)::after { opacity: 1; color: var(--brand-text, var(--brand)); }

/* compare: the left side plays out, then the right */
.ac { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.ac-vs { align-self: center; font: 500 12px var(--mono); color: var(--muted); }
.ac-side { --tone: var(--hairline-2); display: grid; gap: 10px; align-content: start; min-width: 0; opacity: 0.45;
  border: 1.5px solid var(--hairline-2); border-radius: 10px; background: var(--card); padding: 12px 14px; }
.ac-side.tone-good { --tone: var(--green); }
.ac-side.tone-bad { --tone: var(--red); }
.ac-side.on { opacity: 1; border-color: var(--tone); }
.ac-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ac-mark { font-style: normal; font-weight: 700; color: var(--tone); opacity: 0; transform: scale(0.5); }
.ac-mark.on { opacity: 1; transform: none; }
.ac-side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ac-side li { opacity: 0; transform: translateY(4px); border-radius: 6px; padding: 5px 8px; background: color-mix(in srgb, var(--tone) 10%, transparent); }
.ac-side li.on { opacity: 1; transform: none; }
.ac-side li.now { background: color-mix(in srgb, var(--tone) 26%, transparent); }

/* sequence: a message travels between actors while a log fills in below */
.as { --gap: 14px; --col: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n)); display: grid; gap: 4px; }
.as-actors { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: var(--gap); }
.as-actor {
  display: grid; gap: 3px; align-content: start; justify-items: center; text-align: center; min-width: 0; min-height: 86px;
  border: 1.5px solid var(--hairline-2); border-radius: 10px; background: var(--card); padding: 10px 8px;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.as-actor.now, .as-actor.recv { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
.as-role { color: var(--muted); font-size: 13px; }
.as-state { margin-top: 4px; font-size: 13px; border-radius: 6px; padding: 2px 8px; background: color-mix(in srgb, var(--amber) 16%, transparent); }
.as-state:empty { display: none; }
.as-lane { position: relative; height: 46px; }
.as-lane::before {
  content: ""; position: absolute; top: 50%; left: calc(var(--col) / 2); right: calc(var(--col) / 2);
  border-top: 1.5px dashed var(--hairline-2);
}
.as-msg {
  --at: 0; position: absolute; top: 50%; left: calc(var(--col) * (var(--at) + 0.5) + var(--at) * var(--gap));
  transform: translate(-50%, -50%); max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 13px; font-weight: 550; color: var(--brand-fg); background: var(--brand); border-radius: var(--radius-pill); padding: 4px 11px;
  opacity: 0; transition: left 0.9s cubic-bezier(0.45, 0, 0.25, 1), opacity 0.25s ease;
}
.as-msg.show { opacity: 1; }
.as-log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; counter-reset: beat; }
.as-log li { counter-increment: beat; display: grid; grid-template-columns: 18px minmax(0, 11rem) 1fr; gap: 8px; align-items: baseline; opacity: 0.22; border-radius: 6px; padding: 3px 6px; }
.as-log li::before { content: counter(beat); font: 500 11px var(--mono); color: var(--brand-text, var(--brand)); }
.as-log li.on { opacity: 1; }
.as-log li.now { background: color-mix(in srgb, var(--brand) 12%, transparent); }
.as-who { color: var(--muted); }

.anim.still [data-beat], .anim.still .af li:not(:last-child)::after { transition: none; }
.anim.still .as-lane { display: none; }
@media (max-width: 640px) {
  .af { grid-template-columns: 1fr; gap: 22px; }
  .af li:not(:last-child)::after { content: "↓"; right: auto; left: 16px; top: auto; bottom: -20px; transform: none; }
  .ac { grid-template-columns: 1fr; }
  .ac-vs { justify-self: center; }
  .as-log li { grid-template-columns: 18px 1fr; }
  .as-log li .as-who { grid-column: 2; }
  .as-log li > span:last-child { grid-column: 2; }
}
.sub { display: grid; gap: 8px; }
.sub h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.sub .prose { font-size: 16.5px; }
.videos { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.videos li { border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--card); padding: 14px 16px; display: grid; gap: 4px; }
.video-link { display: flex; align-items: baseline; gap: 10px; text-decoration: none; font-weight: 650; }
.video-link:hover .video-title { text-decoration: underline; }
.video-start { flex: none; font: 600 13px var(--mono); color: var(--brand-fg); background: var(--red); border-radius: 6px; padding: 2px 7px; }
.video-meta { font: 12.5px var(--mono); color: var(--muted); }
.video-why { color: var(--muted); font-size: 15px; }
/* "Did you know?": a side note, set apart from the learning sections */
.fact {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start;
  border: 1px dashed color-mix(in srgb, var(--violet) 55%, transparent); border-radius: 16px;
  background: color-mix(in srgb, var(--violet) 7%, var(--card)); padding: 16px 18px; margin-top: 4px;
}
.fact-icon { width: 26px; height: 26px; color: var(--violet); margin-top: 2px; }
.fact-label { display: block; font: 600 12px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--violet); margin-bottom: 4px; }
.fact .prose { font-size: 15.5px; font-style: italic; color: var(--fg); }

/* ===== Jargon ===== */
.term {
  background: color-mix(in srgb, var(--violet) 16%, transparent); color: inherit; cursor: help;
  border-radius: 5px; padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone;
  border-bottom: 1.5px solid color-mix(in srgb, var(--violet) 55%, transparent); transition: background 0.15s;
}
.term:hover, .term:focus-visible, .term.active { background: color-mix(in srgb, var(--violet) 30%, transparent); outline: none; }
.term-tip {
  position: fixed; z-index: 50; max-width: min(300px, calc(100vw - 16px)); padding: 10px 12px;
  background: var(--fg); color: var(--bg); border-radius: var(--radius-sm); font-size: 14px; line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); pointer-events: none;
}
.sec-head h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 700; letter-spacing: -0.02em; }
.prose { display: grid; gap: 12px; max-width: 68ch; }
.lens-blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lens-blocks[data-count="1"] { grid-template-columns: 1fr; }
.lens-card { border: 1px solid var(--hairline); border-radius: var(--radius); padding: 14px 16px; background: var(--card); display: grid; gap: 6px; min-width: 0; }

.examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.example { border: 1px solid var(--hairline); border-radius: var(--radius); padding: 14px 16px; background: var(--card); display: grid; gap: 6px; align-content: start; min-width: 0; }
.example.own { border-color: color-mix(in srgb, var(--brand) 55%, transparent); background: color-mix(in srgb, var(--brand) 7%, var(--card)); }
.example h4 { font-size: 16px; }
.chip { justify-self: start; font: 500 10.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 8px; border-radius: var(--radius-pill); border: 1px solid var(--hairline-2); color: var(--muted); }
.example.own .chip { color: var(--brand-text, var(--brand)); border-color: currentColor; }

.visual { border: 1px solid var(--hairline); border-radius: var(--radius); padding: 16px; background: var(--bg-2); display: grid; gap: 12px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; counter-reset: step; }
.flow li { position: relative; border: 1px solid var(--hairline-2); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--card); counter-increment: step; display: grid; gap: 4px; min-width: 0; }
.flow li::before { content: counter(step, decimal-leading-zero); font: 500 11px var(--mono); color: var(--brand-text, var(--brand)); }
.flow li:not(:last-child)::after { content: "→"; position: absolute; right: -9px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
.flow b { font-size: 14px; line-height: 1.3; }
.flow span { font-size: 13px; color: var(--muted); line-height: 1.45; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare > div { border: 1px solid var(--hairline-2); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--card); min-width: 0; }
.compare ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14.5px; }

pre.code { margin: 0; overflow-x: auto; background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--hairline); border-radius: var(--radius-sm); padding: 14px 16px; font: 13px/1.6 var(--mono); }
.code-wrap { display: grid; gap: 6px; }
.callout { border-left: 3px solid var(--amber); background: var(--amber-bg); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 12px 16px; display: grid; gap: 4px; }
.callout .eyebrow { color: var(--amber); }

/* ===== Quiz ===== */
.score { font: 500 13px var(--mono); color: var(--muted); }
.question { border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--card); padding: 18px; display: grid; gap: 12px; }
.question h3 { font-size: 18px; line-height: 1.4; font-weight: 600; }
.options { display: grid; gap: 8px; }
.option {
  text-align: left; cursor: pointer; border: 1px solid var(--hairline-2); background: var(--glass);
  border-radius: var(--radius-sm); padding: 10px 14px; display: grid; gap: 4px; transition: background 0.15s, border-color 0.15s;
}
.option:hover:not(:disabled) { background: var(--glass-2); }
.option:disabled { cursor: default; }
.option .why { font-size: 14px; color: var(--muted); }
.option.right { border-color: var(--green); background: var(--green-bg); }
.option.wrong { border-color: var(--red); background: var(--red-bg); }
.option.dim { opacity: 0.55; }
.quiz-done { border: 1px solid var(--hairline-2); border-radius: var(--radius); padding: 18px; display: grid; gap: 10px; background: var(--glass); }
.btn { display: inline-flex; align-items: center; gap: 6px; justify-self: start; cursor: pointer; text-decoration: none; border: 1px solid var(--hairline-2); background: var(--glass); border-radius: var(--radius-pill); padding: 7px 14px; font-size: 14px; }
.btn:hover { background: var(--glass-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ===== Next + share ===== */
.next-list { display: grid; gap: 10px; }
.next-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--hairline); border-radius: var(--radius); padding: 12px 16px; background: var(--card); flex-wrap: wrap; }
.next-item > div { min-width: 0; display: grid; gap: 2px; }
.share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
/* Share cards look like a post on each network: logo header, author line, editable post. */
.share-card { --net: #0a66c2; --net-fg: #fff; border: 1px solid var(--hairline); border-top: 4px solid var(--net); border-radius: var(--radius); padding: 14px 16px 16px; background: var(--card); display: grid; gap: 12px; min-width: 0; align-content: start; }
.share-card.x { --net: #000; --net-fg: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .share-card.x { --net: #fff; --net-fg: #000; } }
:root[data-theme="dark"] .share-card.x { --net: #fff; --net-fg: #000; }
.sc-head { display: flex; align-items: center; gap: 10px; }
.sc-logo { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--net); color: var(--net-fg); }
.share-card.li .sc-logo { background: none; color: var(--net); }
.sc-logo svg { width: 20px; height: 20px; }
.share-card.li .sc-logo svg { width: 32px; height: 32px; }
.sc-title { display: grid; line-height: 1.25; min-width: 0; }
.sc-title b { font-size: 16px; }
.sc-title span { font-size: 12.5px; color: var(--muted); }
.sc-head .count { margin-left: auto; }
.count.over { color: var(--red); font-weight: 600; }
.sc-post { border: 1px solid var(--hairline-2); border-radius: var(--radius-sm); background: var(--bg-2); padding: 12px 12px 4px; display: grid; gap: 8px; transition: border-color 0.15s, box-shadow 0.15s; }
.sc-post:focus-within { border-color: var(--net); box-shadow: 0 0 0 3px color-mix(in srgb, var(--net) 18%, transparent); }
.sc-author { display: flex; align-items: center; gap: 8px; line-height: 1.2; }
.sc-author > span:last-child { display: grid; }
.sc-author b { font-size: 13.5px; }
.sc-author span span { font-size: 12px; color: var(--muted); }
.sc-avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; display: grid; place-items: end center; background: linear-gradient(160deg, color-mix(in srgb, var(--net) 22%, var(--card)), color-mix(in srgb, var(--net) 40%, var(--card))); }
.sc-avatar svg { width: 100%; height: 100%; fill: color-mix(in srgb, var(--net) 55%, var(--card)); }
.sc-post textarea { width: 100%; min-height: 120px; resize: none; overflow: hidden; font: 14.5px/1.55 var(--sans); color: var(--fg); background: none; border: 0; padding: 0 0 8px; outline: none; }
.btn.sc-go { background: var(--net); border-color: var(--net); color: var(--net-fg); font-weight: 600; }
.btn.sc-go:hover { background: var(--net); filter: brightness(1.1); }
.btn.sc-go svg { width: 15px; height: 15px; }
.share-repo { margin-top: 14px; font-size: 14px; color: var(--muted); }
.share-repo a { color: var(--fg); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.share-image { display: grid; gap: 10px; }
.share-image canvas { width: 100%; height: auto; border-radius: var(--radius); border: 1px solid var(--hairline); }
.count { font: 12px var(--mono); color: var(--muted); }

footer.site { border-top: 1px solid var(--hairline); padding-block: 28px 48px; margin-top: 24px; }
footer.site .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 12.5px var(--mono); color: var(--muted); }
footer.site a { color: var(--fg); text-decoration-color: var(--hairline-2); text-underline-offset: 3px; }
.watermark .grad { font-size: 1.15em; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: var(--radius-pill); font-size: 14px; z-index: 40; }

/* ===== Feedback ===== */
.feedback { border-top: 1px dashed var(--hairline); padding-top: 12px; display: grid; }
.feedback.overall { border: 1px solid var(--hairline-2); background: var(--glass); border-radius: var(--radius); padding: 16px 18px; }
.fb-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.fb-ask { font-size: 13.5px; color: var(--muted); }
.feedback.overall .fb-ask { font-size: 15px; color: var(--fg); }
.fb-votes { display: inline-flex; gap: 2px; }
.fb-vote { width: 30px; height: 30px; border-radius: 50%; border: 0; background: none; color: var(--muted); opacity: 0.7; cursor: pointer; display: grid; place-items: center; transition: transform 0.15s ease, color 0.15s, background 0.15s, opacity 0.15s; }
.fb-vote svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fb-vote:hover { opacity: 1; color: var(--fg); background: var(--glass); }
.fb-vote:active { transform: scale(0.9); }
.fb-vote[aria-pressed="true"] { opacity: 1; color: var(--brand-text, var(--brand)); background: color-mix(in srgb, var(--brand) 10%, transparent); }
.fb-vote[aria-pressed="true"] svg { fill: color-mix(in srgb, var(--brand) 20%, transparent); }
.feedback.voted .fb-vote[aria-pressed="false"] { opacity: 0.35; }
.fb-vote { position: relative; }
.fb-vote.got svg { animation: fb-pop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
.fb-vote.got::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--brand-text, var(--brand)); animation: fb-ring 0.6s ease-out forwards; pointer-events: none; }
@keyframes fb-pop { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-8deg); } 100% { transform: scale(1); } }
@keyframes fb-ring { from { transform: scale(0.8); opacity: 0.7; } to { transform: scale(1.7); opacity: 0; } }
.fb-thanks:not([hidden]) { animation: fb-fade 0.3s ease; }
@keyframes fb-fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.fb-form { display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(-4px); transition: grid-template-rows 0.25s ease, opacity 0.2s ease, transform 0.25s ease; }
.fb-form.open { grid-template-rows: 1fr; opacity: 1; transform: none; }
.fb-inner { min-height: 0; overflow: hidden; display: grid; gap: 8px; padding: 0 3px; margin: 0 -3px; transition: padding 0.25s ease; }
.fb-form.open .fb-inner { padding: 10px 3px 3px; }
.fb-thanks { margin-top: 10px; }
.fb-field { display: grid; background: var(--card); border: 1px solid var(--hairline-2); border-radius: var(--radius-sm); transition: border-color 0.15s, box-shadow 0.15s; }
.fb-field:focus-within { border-color: var(--brand-text, var(--brand)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.fb-form textarea { display: block; width: 100%; resize: vertical; min-height: 64px; font: 15px/1.5 var(--sans); color: var(--fg); background: none; border: 0; outline: none; padding: 10px 12px 4px; }
.fb-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 0 8px 8px 12px; }
.fb-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fb-count.low { color: color-mix(in srgb, var(--amber) 60%, var(--fg)); }
.fb-send { margin-left: auto; padding: 5px 14px; font-size: 13.5px; opacity: 0; transform: translateY(4px); pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; }
.fb-form.has-text .fb-send { opacity: 1; transform: none; pointer-events: auto; }
.fb-thanks { font-size: 14px; color: var(--muted); }
.fb-edit { border: 0; background: none; padding: 0; color: var(--brand-text, var(--brand)); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .fb-vote, .fb-form, .fb-inner, .fb-send { transition: none; } .fb-vote.got svg, .fb-vote.got::after, .fb-thanks:not([hidden]) { animation: none; } .fb-vote[aria-pressed="true"], .fb-vote:active { transform: none; } }

/* ===== Data sharing consent ===== */
.consent {
  position: fixed; left: 16px; right: auto; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 70;
  width: calc(100vw - 32px); max-width: none; margin: 0; color: var(--fg);
  background: var(--bg); border: 1px solid var(--hairline-2); border-radius: 16px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
  padding: 18px 44px 18px 20px; font-size: 14.5px;
  opacity: 0; transform: translateY(16px); transition: opacity 0.22s ease, transform 0.22s ease;
}
.consent[open] { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; }
.consent.open { opacity: 1; transform: none; }
.consent-shade { position: fixed; inset: 0; z-index: 69; background: rgba(0, 0, 0, 0.22); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.2s ease; }
.consent-shade.open { opacity: 1; }
.consent-body { display: grid; gap: 8px; min-width: 0; }
.consent-x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.consent-x:hover { background: var(--glass-2); color: var(--fg); }
.consent-x svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
@media (max-width: 680px) {
  .consent { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .consent[open] { grid-template-columns: 1fr; gap: 12px; }
}
.consent h3 { font-size: 18px; }
.consent p { color: var(--muted); }
.consent-need { justify-self: start; font-size: 13px; font-weight: 600; color: color-mix(in srgb, var(--amber) 60%, var(--fg)) !important; background: var(--amber-bg); border-radius: var(--radius-pill); padding: 4px 10px; }
.consent-more { justify-self: start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; font-size: 13.5px; color: var(--fg); cursor: pointer; }
.consent-more svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.25s ease; }
.consent-more[aria-expanded="true"] svg { transform: rotate(90deg); }
.consent-details { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.3s ease, opacity 0.25s ease; font-size: 13.5px; color: var(--muted); }
.consent-details.open { grid-template-rows: 1fr; opacity: 1; }
.consent-details > div { min-height: 0; overflow: hidden; }
.consent-details ul { margin: 2px 0 8px; padding-left: 18px; display: grid; gap: 2px; }
.consent-fine { font-size: 12.5px; }
.consent-actions { display: grid; gap: 8px; min-width: 140px; }
.consent-actions .btn { justify-self: stretch; justify-content: center; }
@media (prefers-reduced-motion: reduce) { .consent, .consent-shade, .consent-details, .consent-more svg { transition: none; transform: none; } }

/* ===== Library ===== */
.lib-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.lib-row { display: grid; gap: 4px; padding: 14px 8px; border-bottom: 1px solid var(--hairline); text-decoration: none; border-radius: var(--radius-sm); }
.lib-row:hover { background: var(--glass); }
.lib-row h3 { font-size: 17px; }
.lib-meta { font-size: 13px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: 12.5px; line-height: 1; color: var(--muted); border: 1px solid var(--hairline-2); background: var(--glass); border-radius: var(--radius-pill); padding: 5px 10px; }
.tag.area { color: var(--brand-text, var(--brand)); border-color: color-mix(in srgb, var(--brand-text, var(--brand)) 45%, transparent); background: color-mix(in srgb, var(--brand) 8%, transparent); }
.search { width: 100%; max-width: 360px; font: 15px var(--sans); color: var(--fg); background: var(--glass); border: 1px solid var(--hairline-2); border-radius: var(--radius-pill); padding: 8px 14px; }
.empty { border: 1px dashed var(--hairline-2); border-radius: var(--radius); padding: 24px; color: var(--muted); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 0; }
  .sidebar {
    position: sticky; top: var(--topbar-h, 52px); z-index: 10; max-height: none; overflow-x: auto; overflow-y: hidden;
    padding-block: 8px; margin-inline: -20px; padding-inline: 20px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline); scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display: none; }
  .side-title { display: none; }
  .sidebar ol { grid-auto-flow: column; gap: 4px; }
  .sidebar a { white-space: nowrap; padding: 5px 10px; font-size: 13px; }
  .sidebar .tick { width: 18px; height: 18px; }
}

@media (max-width: 640px) {
  .lens-blocks, .compare, .share-grid { grid-template-columns: 1fr; }
  .flow { grid-auto-flow: row; }
  .flow li:not(:last-child)::after { content: "↓"; right: auto; left: 14px; top: auto; bottom: -15px; transform: none; }
  .hero { padding-block: 36px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}

/* ===== Animated bars: amounts side by side ===== */
.ab { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.ab li { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; align-items: center; }
.ab-text { display: grid; gap: 2px; min-width: 0; }
.ab-text b { font-weight: 600; font-size: 15px; }
.ab-text span { color: var(--muted); font-size: 13.5px; }
.ab-track { height: 22px; border-radius: 6px; background: var(--glass-2); overflow: hidden; }
.ab-fill { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--brand); transition: width 900ms cubic-bezier(.2, .7, .2, 1); }
.ab li.tone-good .ab-fill { background: var(--green); }
.ab li.tone-bad .ab-fill { background: var(--red); }
.ab li.on .ab-fill { width: var(--w); }
.ab li:not(.on) .ab-text { opacity: 0.45; }
.anim.still .ab-fill { transition: none; }
@media (max-width: 560px) { .ab li { grid-template-columns: 1fr; gap: 6px; } }
@media (prefers-reduced-motion: reduce) { .ab-fill { transition: none; } }

/* ===== Bespoke animations (sandboxed frame) ===== */
.bespoke-frame { border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-2); }
.bespoke-frame iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ===== One-time hints (coach marks) ===== */
.coach {
  position: fixed; z-index: 60; max-width: min(300px, calc(100vw - 24px)); padding: 12px 14px 12px 14px;
  background: var(--brand); color: var(--brand-fg); border-radius: 12px; font-size: 14px; line-height: 1.45;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); display: grid; gap: 8px;
}
.coach b { font-weight: 700; }
.coach button { justify-self: end; border: 0; background: color-mix(in srgb, var(--brand-fg) 20%, transparent); color: var(--brand-fg); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.coach::after { content: ""; position: absolute; left: var(--arrow-x, 24px); width: 12px; height: 12px; background: var(--brand); transform: rotate(45deg); }
.coach.below::after { top: -6px; }
.coach.above::after { bottom: -6px; }
.coach.corner::after { display: none; }

/* ===== Bigger first-time hint with a tiny demo ===== */
.coach.big { max-width: min(340px, calc(100vw - 24px)); padding: 16px; font-size: 15px; }
.coach-demo { display: grid; gap: 8px; justify-items: start; background: color-mix(in srgb, var(--brand-fg) 14%, transparent); border-radius: 10px; padding: 10px 12px; }
.cd-line { font-size: 14px; }
.cd-sel { border-radius: 4px; padding: 0 2px; background-size: 0% 100%; background-repeat: no-repeat; background-image: linear-gradient(color-mix(in srgb, var(--brand-fg) 45%, transparent), color-mix(in srgb, var(--brand-fg) 45%, transparent)); animation: cd-sweep 3.2s ease-in-out infinite; }
.cd-pill { font-size: 12.5px; font-weight: 700; background: var(--brand-fg); color: var(--brand); border-radius: 999px; padding: 4px 10px; opacity: 0; transform: translateY(4px); animation: cd-pop 3.2s ease-in-out infinite; }
@keyframes cd-sweep { 0%, 10% { background-size: 0% 100%; } 40%, 85% { background-size: 100% 100%; } 100% { background-size: 0% 100%; } }
@keyframes cd-pop { 0%, 42% { opacity: 0; transform: translateY(4px); } 52%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ===== Select text → ask ===== */
.ask-pop {
  position: absolute; z-index: 55; display: flex; gap: 4px; padding: 5px; border-radius: 999px;
  background: var(--fg); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3); animation: pop-in 0.18s ease-out;
}
.ask-pop::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: var(--fg); transform: translateX(-50%) rotate(45deg); }
.ask-pop.below::after { bottom: auto; top: -5px; }
.ask-pop button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 8px 14px; font: 600 14px var(--sans); cursor: pointer; background: transparent; color: var(--bg); }
.ask-pop button[data-act="ask"] { background: var(--brand); color: var(--brand-fg); }
.ask-pop svg { width: 16px; height: 16px; }
@keyframes pop-in { from { opacity: 0; transform: translateY(4px) scale(0.97); } to { opacity: 1; transform: none; } }

/* ===== Passages you asked about ===== */
/* Asked passages look like an old-school highlighter stroke (same yellow in light and dark mode). */
mark.asked {

      "story": "Tara hires a helper to organise who can open accounts and collect records. Her customer then asks who checked the work. The helper can explain what it did. But the customer may need a separate, qualified organisation to issue a particular report or certificate. The helper cannot guarantee the decision that this outside checker will make.",
      "explain": "Think of preparing for a driving test. An instructor helps you practise; an authorised examiner decides whether you pass. **Independent assessment** works like that: a separate, qualified person or organisation performs the formal check. A preparation helper can build safeguards and organise proof. The outside checker, called an assessor, examines the agreed scope: the exact activities included in the check. Its conclusion depends on what it finds, including weaknesses that still need work.",

  "deep_dive": [
    {
      "id": "information",
      "title": "1. List the information the business holds",
      "paragraphs": [
        "Imagine Tara's 30-person Indian software business. It holds employee bank details, customer names, support messages, invoices, and passwords that open its systems. Some information identifies a person. Some is a customer's business secret. Some, such as a password, lets someone act inside the service. Each kind needs a reason for being collected and an owner who can answer questions about it.",
        "Walk through one customer journey: someone signs up, pays, asks for help, and later leaves. Where does their information go? Who can read it? Which supplier keeps a copy? What happens if it disappears, changes, or reaches the wrong person? Those are practical risk questions. Start with a plain list and a drawing of the journey. Use made-up records while practising. Real customer information requires authorisation and an agreed handling process."
      ],
      "source_refs": [
        0,
        12
      ]
    },
    {
      "id": "differences",
      "title": "2. Security, privacy, and compliance",
      "paragraphs": [
        "Security asks whether information and systems are protected against harm. A locked account helps prevent an outsider reading support messages. A backup, a spare recoverable copy, helps when information is lost. Privacy asks whether the business should collect a person's information, what it tells them, how it uses that information, and how it handles their rights.",
        "Compliance asks whether applicable requirements are being met. A contract might require departing employees to lose access within an agreed time. A law might impose duties concerning people's information. A customer might ask for an independent report before signing. These are related questions with different answers. A business can protect a database, an organised store of information, well while collecting information it has no proper reason to use. It can also have a handsome policy document while leaving old accounts open. Ask all three questions instead of treating one certificate as proof of everything."
      ],
      "source_refs": [
        0,
        12,
        4
      ]
    },
    {
      "id": "requirements",
      "title": "3. Who says you must do it?",
      "paragraphs": [
        "A law is a legal rule made through the country's lawmaking process. A regulator is a public authority that supervises a particular area and may issue binding directions within its powers. A standard is an organised set of requirements or guidance. A contract is an agreement between parties, such as a customer and supplier. Keep those sources separate when writing a client's requirement list.",
        "A standard can be voluntary in general while becoming a requirement of a particular customer contract. Certification is an outside body's formal confirmation against a specified standard and scope; it does not erase other duties. Ask who requires the item, which part of the business it covers, when it must be met, and what result they will accept. Have a qualified adviser check legal interpretation and a suitable assessor confirm assessment expectations before selling a particular outcome."
      ],
      "source_refs": [
        0,
        1,
        2,
        4
      ]
    },
    {
      "id": "india",
      "title": "4. India has several layers of rules",
      "paragraphs": [
        "Information technology, shortened to IT, includes computers and software. India's IT Act provides the legal setting for directions from the Indian Computer Emergency Response Team, called CERT-In. Businesses and organisations covered by these directions must report the listed kinds of computer security incidents within six hours of noticing them or being told about them. The directions also address keeping relevant system logs, records of system activity, for 180 days. Read their India-location wording alongside the official questions and answers: question 35 permits logs outside India if they can be produced within reasonable time. This does not mean all customer information must be stored in India.",
        "The Reserve Bank of India, called RBI, and the Securities and Exchange Board of India, called SEBI, supervise particular financial entities and activities. Their rules for the businesses they supervise do not automatically cover every startup. A supplier may receive related contractual requirements from a customer supervised by a regulator. Check both the customer's status and the actual agreement."
      ],
      "source_refs": [
        2,
        3,
        6,
        7
      ]
    },
    {
      "id": "privacy-dates",
      "title": "5. Check when personal information duties begin",
      "paragraphs": [
        "The Digital Personal Data Protection Act, shortened to DPDP Act, concerns digital information about people within its legal scope. The notices bringing the Act into force and the 2025 rules set different start dates for different provisions. As of 25 November 2026, most rules governing day-to-day duties are scheduled to begin in May 2027. Some parts have earlier start dates. Do not say every duty can already be enforced, or that the later timetable removes existing obligations under other law or contracts.",
        "Preparation can begin with a list of the information the business holds, clear purposes, understandable notices, safeguards, and a plan for handling requests and incidents. Consent means a person's agreement. It is one route the Act allows for processing, or handling, their information; the Act also allows certain activities called legitimate uses. The General Data Protection Regulation, called GDPR, is the European Union's personal data law. Whether it applies depends on the places and activities the law covers, and what the business does. Ask a qualified legal adviser to check what is covered, who is responsible, and which dates apply."
      ],
      "source_refs": [
        4,
        5,
        12
      ]
    },
    {
      "id": "frameworks",
      "title": "6. Find out which result the customer needs",
      "paragraphs": [
        "ISO/IEC 27001 concerns an information security management system, meaning arrangements for choosing, running, checking, and improving safeguards. The certificate covers only the activities and systems included in its agreed boundaries. SOC 2 is an independent accountant's report on safeguards checked against selected requirements called trust services criteria. It is not an ISO certificate or a universal requirement simply because a buyer is American. Ask what that buyer actually needs.",
        "Payment Card Industry, shortened to PCI, standards concern payment card security. Validation, the process of confirming that requirements are met, can use different official forms or checks depending on the business's role and the programme's rules. Sending checkout to another provider can reduce responsibilities, but does not automatically remove every obligation. Ask the organisation requesting validation which form or check it requires. DPDP and GDPR set legal duties, not commercial badges sold as substitutes for following law. Start with the required outcome, then select preparation work that supports it."
      ],
      "source_refs": [
        0,
        1,
        8,
        9,
        4,
        12
      ]
    },
    {
      "id": "building-blocks",
      "title": "7. Six building blocks, one leaving employee",
      "paragraphs": [
        "Scope is the boundary of the work: perhaps Tara's service used by customers, its staff, and supporting systems. An asset is something valuable, such as a laptop, account, or customer database. A risk is a possible harmful event, such as a former employee continuing to read customer information. Describe the harm as well as the event so the reason for fixing it stays clear.",
        "A control reduces that risk: disable the person's accounts when employment ends. A policy states the rule, responsible person, and expected timing. Evidence shows what happened: an approved departure request, a dated closure record, and a check that access stopped. One screenshot may show only one system at one moment. Check all systems within scope and retain proof through an agreed process. This chain turns \"we take security seriously\" into work a manager and outside assessor can examine."
      ],
      "source_refs": [
        0,
        8
      ]
    },
    {
      "id": "teams",
      "title": "8. Give each team a clear job",
      "paragraphs": [
        "The people team knows when someone joins, changes role, or leaves. The information technology team manages devices and many accounts. Engineers build the software and can change access, records, and backups. Procurement, the people who arrange supplier purchases, checks what suppliers are responsible for. Legal advisers interpret law and contracts. Management approves priorities, spending, and risks the business chooses to accept.",
        "Give each action one named owner, one due date, and a person who checks completion. For Tara's departing employee, the people team starts the request, account owners remove access, and a reviewer checks completion. A consultant can organise the process, but cannot quietly accept a business risk on management's behalf. If a critical change could interrupt the service, agree how it will be tested and approved first. A shared action list helps everyone see what remains open and who needs help."
      ],
      "source_refs": [
        0
      ]
    },
    {
      "id": "delivery",
      "title": "9. Take a client from questions to dated proof",
      "paragraphs": [
        "Begin the first client call by asking what triggered the request, who wants the result, and by when. Agree scope and obtain permission before examining systems. Compare current arrangements with applicable requirements. Produce a gap list, meaning a list of missing or weak arrangements, with owners, priorities, and an explanation of possible harm. Separate urgent problems in day-to-day work from paperwork that can wait.",
        "Help owners put agreed safeguards into use. Collect dated proof as processes run; do not invent records suggesting past work occurred. Check a sample of the records, explain remaining weaknesses, and let management approve decisions. If independent assessment is required, a qualified outside assessor checks the agreed scope and issues its own findings. Plan time for corrections. Maintain access reviews, supplier checks, practice sessions for responding to security problems, and other agreed routines afterward. The schedule follows requirements and risk, rather than a promise that one project makes the business compliant forever."
      ],
      "source_refs": [
        0,
        1,
        8
      ]
    },
    {
      "id": "position",
      "title": "10. What Perimattic could offer",
      "paragraphs": [
        "Perimattic could explore preparation and implementation: helping a business understand requests, organise evidence, assign work, and make agreed engineering changes. Its public website provides background for considering a service built around engineering work. It does not by itself prove assessment authority, staff qualifications, completed projects helping clients meet requirements, or permission to issue a particular result. This is a possible service design to validate, not a claim about qualifications or authority it already holds.",
        "Separate three roles in a proposal. An adviser helps interpret and plan. An implementer changes systems and processes with customer approval. An independent assessor examines the result under the professional rules that apply to its work. Writing policies does not establish authority to issue certificates or reports. Build a relationship with a qualified specialist before offering work your team has not done before. Explain who does what, who reviews delivery, and who issues any formal outcome. Make claims specific enough that a prospective customer can check them."
      ],

      "id": "starter",
      "title": "11. Start with a small paid preparation check",
      "paragraphs": [
        "A starter offer could be a readiness review with agreed boundaries, a check of how prepared a business is for one named customer requirement. Deliver a scope statement, an information and system inventory, a requirement list, a list of missing or weak arrangements ranked by urgency, an action plan naming who will do each task and by when, and an evidence checklist. Include a closing conversation so management understands decisions rather than receiving an unexplained folder.",
        "State exclusions: no legal opinion, no certification, no independent accountant's report, no testing that probes or could disrupt systems, and no guaranteed assessment pass. Changes to live systems need separate agreement and approval. Arrange qualified expert review of requirement interpretation, sample evidence, and recommendations. This lesson gives a beginner a map; it does not qualify them to provide specialist opinions about whether requirements have been met. Price the workload, including expert review. Agree how extra systems or changed customer requests affect the work before starting."
      ],

        1,
        8
      ]
    },
    {
      "id": "buyer",
      "title": "12. Test your idea of who might buy",
      "paragraphs": [
        "An ideal customer profile, shortened to ICP, describes the kind of buyer you think may need the offer, so you can test that idea. Your first idea to test could be an Indian business selling software to other businesses, called B2B, with 20 to 100 staff, working engineers, no dedicated compliance owner, and a current requirement from a large customer. Add a real deadline and plausible budget. These features are assumptions, not evidence of demand.",
        "The buyer might be a founder or chief technology officer, called CTO, who leads technology decisions. Ask who owns the customer deal, who approves spending, and who will supply evidence. A vague wish for a badge may need education rather than a paid project. A named requirement, person responsible for moving the project forward, available staff, and deadline make the situation easier to evaluate. Revise the profile when conversations show another group has a clearer problem and ability to buy."
      ],
      "source_refs": [
        11,
        0
      ]
    },
    {
      "id": "finding",
      "title": "13. Find out whether anyone wants to buy",
      "paragraphs": [
        "Start with existing client relationships and partners who know Perimattic's engineering work. Referral partners might include qualified security advisers and accounting firms, provided roles and independence are handled correctly. Research 30 possible customer businesses using public information and lawful sources. Record why each appears relevant, the likely buyer, and what remains unknown. Public clues are starting points for questions, not proof of security weaknesses.",
        "Aim for ten discovery conversations, meaning discussions to understand a possible customer's problem. Ask: What exact request arrived? Which deal or deadline depends on it? What have you tried? Who can make changes? Who approves payment? What outcome would count as useful? Ask permission before viewing confidential documents. Look for repeated problems and willingness to buy a review with agreed boundaries. This is a research plan, not a guarantee of clients, and does not authorise sending outreach or messages on anyone's behalf."
      ],

    {
      "id": "money",
      "title": "14. Work out what is left after costs",
      "paragraphs": [
        "For learning only, imagine a readiness review priced at ₹30,000 to ₹50,000. This range is an untested assumption, not verified Indian market pricing or a recommended quote. A real proposal needs scope, staff effort, expert review, support, and payment terms. Speak with buyers and qualified delivery partners before deciding whether any price is credible.",
        "Imagine an implementation project brings in ₹3,00,000. An implementer costs ₹1,50,000 and other delivery expenses cost ₹20,000. That leaves ₹1,30,000 before valuing the owner's work. Suppose the owner spends 60 hours and values each at ₹1,000: another ₹60,000. The remaining ₹70,000 is before general business expenses, tax, and sales costs. It is not take-home profit. Delays, rework, expert review, or unpaid invoices can reduce it further. Write assumptions beside the calculation and update them after a pilot, a small first project testing the offer."

      "id": "month",
      "title": "15. Plan the first month and set limits",

1 71.1911 10.3749 70.4846 10.3749C69.9476 10.3749 69.4177 10.519 68.8948 10.8072C68.372 11.0803 67.941 11.4672 67.6018 11.9678V20.6294H65.4609V3.50586H67.6018Z" fill="currentColor"/><path d="M49.4858 20.4948L54.2356 9.16895H51.9477L49.3366 15.7993L46.5513 9.16895H44.537L45.3576 11.0007L43.4428 15.6445L40.6824 9.16895H38.3945L43.1692 20.4948L46.1783 13.1678L49.4858 20.4948Z" fill="currentColor"/><path d="M11.7693 19.9889C12.8659 19.6517 13.6691 19.2839 14.1788 18.8854V11.094H8.57215V13.232H11.9083V17.598C11.5377 17.8126 11.0743 17.9812 10.5183 18.1038C9.96223 18.2111 9.39074 18.2647 8.80383 18.2647C7.53731 18.2647 6.40982 18.0118 5.42131 17.5061C4.4328 16.985 3.66825 16.257 3.12768 15.3221C2.5871 14.3872 2.3168 13.3221 2.3168 12.1267C2.3168 10.8393 2.5871 9.71285 3.12768 8.74732C3.66825 7.78179 4.4328 7.03849 5.42131 6.5174C6.42524 5.99631 7.57593 5.73578 8.87334 5.73578C9.47571 5.73578 10.1476 5.84307 10.889 6.05762C11.4481 6.20483 11.9356 6.37293 12.3514 6.56195L13.5069 4.72427C12.8428 4.35645 12.0937 4.06524 11.2596 3.85069C10.4256 3.6208 9.5375 3.50586 8.59532 3.50586C7.03536 3.50586 5.59894 3.85834 4.28608 4.56335C2.97321 5.26835 1.93066 6.28751 1.1584 7.62086C0.386134 8.93888 0 10.5021 0 12.3106C0 13.8585 0.355241 15.2532 1.06573 16.4946C1.79166 17.736 2.81878 18.7168 4.14707 19.4371C5.47536 20.1421 7.01219 20.4946 8.7575 20.4946C9.68422 20.4946 10.6882 20.3261 11.7693 19.9889Z" fill="currentColor"/><path d="M58.1964 5.54883H60.5185V9.35403H63.3649V11.1847H60.5185V20.4948H58.1964V11.1847H56.2988V9.35403H58.1964V5.54883Z" fill="currentColor"/></svg>';
  function topbar() {
    return (
      '<header class="topbar"><div class="wrap topbar-lesson">' +
      '<a class="brand" href="' + REPO_URL + '" target="_blank" rel="noopener">' + GX_LOGO + ' <span class="grad">teach</span></a>' +
      '<div class="controls">' +
      (thisDir ? '<a class="btn" href="../../index.html">All lessons</a>' : "") +
      '<button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch light or dark theme">◐</button>' +
      "</div></div></header>"
    );
  }

  function hero() {
    var level = meta.level || {};
    var eyebrow = [areaNames[meta.domain] || meta.domain, DEPTH_LABELS[level.depth], meta.minutes ? meta.minutes + " min" : ""]
      .filter(Boolean).map(esc).join(" · ");
    return (
      '<section class="hero" id="start" data-nav="Start">' +
      '<p class="eyebrow">' + eyebrow + "</p>" +
      "<h1>" + rich(meta.title, true) + "</h1>" +
      (lesson.hook ? '<p class="lede">' + rich(lesson.hook) + "</p>" : "") +
      (lesson.goal ? '<div class="goal"><span class="eyebrow">By the end</span><p>' + rich(lesson.goal) + "</p></div>" : "") +
      "</section>"
    );
  }

  // Every concept gets an animated figure: it plays one beat at a time when it
  // scrolls into view and loops. Anything that appears carries data-beat="k" and
  // is switched on once the player reaches beat k (see the animated figures
  // section). The same content stays in the page as plain text for screen
  // readers, and is the whole figure when motion is turned off.
  var visuals = [];
  function actorIndex(v, id) {
    var list = v.actors || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return i;
    return 0;
  }
  function stepText(v, s) {
    var actors = v.actors || [];
    if (s.at !== undefined) return plain((actors[actorIndex(v, s.at)] || {}).name) + ": " + plain(s.says);
    return plain((actors[actorIndex(v, s.from)] || {}).name) + " to " + plain((actors[actorIndex(v, s.to)] || {}).name) + ": " + plain(s.label);
  }
  function flowStage(v) {
    var steps = v.steps || [];
    return {
      beats: steps.length,
      alt: steps.map(function (s) { return plain(s.label) + ": " + plain(s.detail); }),
      html: '<ol class="af" style="--n:' + steps.length + '">' + steps.map(function (s, i) {
        return '<li data-beat="' + (i + 1) + '"><span class="af-n">' + (i + 1) + "</span><b>" + rich(s.label) + "</b><span>" + rich(s.detail) + "</span></li>";
      }).join("") + "</ol>"
    };
  }
  function compareStage(v) {
    var beat = 0, alt = [];
    var sides = ["left", "right"].map(function (k) {
      var x = v[k] || {}, pts = x.points || [], first = beat + 1;
      var tone = x.tone === "good" || x.tone === "bad" ? x.tone : "neutral";
      var items = pts.map(function (p) { beat++; return '<li data-beat="' + beat + '">' + rich(p) + "</li>"; }).join("");
      alt.push(plain(x.title) + ": " + pts.map(plain).join("; "));
      var mark = tone === "neutral" ? "" : '<i class="ac-mark" data-beat="' + beat + '">' + (tone === "good" ? "✓" : "✗") + "</i>";
      return '<div class="ac-side tone-' + tone + '" data-beat="' + first + '"><div class="ac-title"><b>' + rich(x.title) + "</b>" + mark + "</div><ul>" + items + "</ul></div>";
    });
    return { beats: beat, alt: alt, html: '<div class="ac">' + sides[0] + '<span class="ac-vs">vs</span>' + sides[1] + "</div>" };
  }
  function sequenceStage(v) {
    var actors = v.actors || [], steps = v.steps || [];
    return {
      beats: steps.length,
      alt: steps.map(function (s) { return stepText(v, s); }),
      html: '<div class="as" style="--n:' + actors.length + '">' +
        '<div class="as-actors">' + actors.map(function (a) {
          return '<div class="as-actor"><b>' + rich(a.name) + "</b>" + (a.role ? '<span class="as-role">' + rich(a.role) + "</span>" : "") + '<span class="as-state"></span></div>';
        }).join("") + "</div>" +
        '<div class="as-lane"><span class="as-msg"></span></div>' +
        '<ol class="as-log">' + steps.map(function (s, i) {
          var who = s.at !== undefined
            ? plain((actors[actorIndex(v, s.at)] || {}).name)
            : plain((actors[actorIndex(v, s.from)] || {}).name) + " → " + plain((actors[actorIndex(v, s.to)] || {}).name);
          return '<li data-beat="' + (i + 1) + '"><span class="as-who">' + esc(who) + "</span><span>" + rich(s.at !== undefined ? s.says : s.label) + "</span></li>";
        }).join("") + "</ol></div>"
    };
  }
  // Amounts side by side (time, cost, size): each bar grows to its value on its beat.
  // Tiny values keep a visible sliver so they don't vanish next to big ones.
  function barsStage(v) {
    var bars = v.bars || [];
    var max = Math.max.apply(null, bars.map(function (b) { return Number(b.value) || 0; }).concat([0])) || 1;
    return {
      beats: bars.length,
      alt: bars.map(function (b) { return plain(b.label) + ": " + plain(b.display); }),
      html: '<ol class="ab">' + bars.map(function (b, i) {
        var pct = Math.max(1.5, (Number(b.value) || 0) / max * 100);
        var tone = b.tone === "good" || b.tone === "bad" ? b.tone : "neutral";
        return '<li data-beat="' + (i + 1) + '" class="tone-' + tone + '" style="--w:' + pct.toFixed(2) + '%">' +
          '<div class="ab-text"><b>' + rich(b.label) + '</b><span>' + rich(b.display) + "</span></div>" +
          '<div class="ab-track"><span class="ab-fill"></span></div></li>';
      }).join("") + "</ol>"
    };
  }

  function visual(v) {
    if (!v) return "";
    var stage = v.type === "sequence" ? sequenceStage(v) : v.type === "compare" ? compareStage(v) : v.type === "bars" ? barsStage(v) : flowStage(v);
    var idx = visuals.push({ v: v, beats: stage.beats }) - 1;
    return (
      '<figure class="anim" data-anim="' + idx + '" data-type="' + esc(v.type) + '">' +
      '<div class="anim-head"><strong>' + rich(v.title) + "</strong>" +
      '<button class="anim-btn" type="button" hidden>Pause</button></div>' +
      '<div class="anim-stage" aria-hidden="true">' + stage.html + "</div>" +
      '<ol class="anim-alt">' + stage.alt.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol>" +
      (v.caption ? "<figcaption>" + rich(v.caption) + "</figcaption>" : "") +
      "</figure>"
    );
  }

  // A bespoke animation, designed for this one concept by the animator agent.
  // It runs inside a sandboxed frame: scripts only, no network (CSP), no access
  // to this page, its storage or cookies. The frame gets the lesson's colours.
  var bespokes = [];
  function bespoke(a) {
    var idx = bespokes.push(a) - 1;
    var h = Math.min(440, Math.max(180, Number(a.height) || 300));
    return (
      '<figure class="anim bespoke">' +
      '<div class="anim-head"><strong>' + rich(a.title) + "</strong></div>" +
      '<div class="bespoke-frame" style="height:' + h + 'px"><iframe data-bespoke="' + idx + '" sandbox="allow-scripts" title="' + esc(plain(a.title)) + '" aria-describedby="bespoke-alt-' + idx + '"></iframe></div>' +
      '<p class="sr-only" id="bespoke-alt-' + idx + '">' + esc(a.alt) + "</p>" +
      (a.caption ? "<figcaption>" + rich(a.caption) + "</figcaption>" : "") +
      "</figure>"
    );
  }

  // What the session was about, for learners who have forgotten the chat by the time they open the lesson.
  function sessionSection() {
    var s = lesson.session;
    if (!s || !s.about) return "";
    return (
      '<section class="block session" id="session" data-nav="Your session">' +
      '<div class="sec-head"><span class="sec-num">Recap</span><h2>What you were working on</h2></div>' +
      '<p class="session-about">' + rich(s.about) + "</p>" +
      (s.did ? '<div class="prose">' + paras(s.did) + "</div>" : "") +
      '<div class="session-learn"><span class="eyebrow">What you\'ll learn today</span><ul>' +
      concepts.map(function (c) { return '<li><a href="#c-' + esc(c.id) + '">' + esc(plain(c.name)) + "</a></li>"; }).join("") +
      "</ul></div></section>"
    );
  }

  function concept(c) {
    return (
      '<section class="block" id="c-' + esc(c.id) + '" data-nav="' + esc(plain(c.name)) + '">' +
      (c.story ? '<div class="story prose">' + paras(c.story) + "</div>" : "") +
      '<div class="sec-head"><h2>' + rich(c.name) + "</h2></div>" +
      '<div class="analogy"><span class="eyebrow">Analogy</span><div class="prose">' + paras(c.explain) + "</div></div>" +
      (c.animation ? bespoke(c.animation) : visual(c.visual)) +
      (c.real_world ? '<div class="sub"><h3>In the real world</h3><div class="prose">' + paras(c.real_world) + "</div></div>" : "") +
      (c.in_your_work && c.in_your_work.text ? '<div class="sub"><h3>In your work</h3><div class="prose">' + paras(c.in_your_work.text) + "</div></div>" : "") +
      (c.fun_fact
        ? '<aside class="fact" aria-label="Did you know?">' +
          '<svg class="fact-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<div><span class="fact-label">Did you know?</span><div class="prose">' + paras(c.fun_fact) + "</div></div></aside>"
        : "") +
      "</section>"
    );
  }

  function quizSection() {
    if (!quiz.length) return "";
    var qs = quiz.map(function (q, qi) {
      var opts = (q.options || []).map(function (o, oi) {
        return '<button type="button" class="option" data-q="' + qi + '" data-o="' + oi + '"><span>' + rich(o.text) + '</span><span class="why" hidden>' + rich(o.why) + "</span></button>";
      }).join("");
      return '<div class="question" id="q-' + qi + '"><span class="eyebrow">Question ' + (qi + 1) + " of " + quiz.length + "</span><h3>" + rich(q.question) + '</h3><div class="options">' + opts + "</div></div>";
    }).join("");
    return (
      '<section class="block" id="quiz" data-nav="Quiz">' +
      '<div class="sec-head"><span class="sec-num">Quiz</span><h2>Check yourself</h2></div>' +
      '<p class="score" id="score" aria-live="polite">0 of ' + quiz.length + " answered</p>" +
      qs +
      '<div class="quiz-done" id="quiz-done" hidden></div>' +
      "</section>"
    );
  }

  function nextSection() {
    var next = lesson.next || [];
    if (!next.length) return "";
    return (
      '<section class="block" id="next" data-nav="Keep going">' +
      '<div class="sec-head"><span class="sec-num">Next</span><h2>Keep going</h2></div>' +
      '<div class="next-list">' + next.map(function (n, i) {
        return '<div class="next-item"><div><b>' + rich(n.title) + "</b><code>" + esc(n.prompt) + '</code></div><button type="button" class="btn" data-copy-next="' + i + '">Copy prompt</button></div>';
      }).join("") + "</div></section>"
    );
  }

  function videosSection() {
    var videos = (lesson.videos || []).filter(function (v) { return v && v.url && v.title; });
    if (!videos.length) return "";
    var names = {};
    concepts.forEach(function (c) { names[c.id] = plain(c.name); });
    return (
      '<section class="block" id="watch" data-nav="Watch">' +
      '<div class="sec-head"><span class="sec-num">Annex</span><h2>Prefer watching?</h2></div>' +
      '<ol class="videos">' + videos.map(function (v) {
        var safe = /^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(v.url) ? v.url : "#";
        return (
          "<li>" +
          '<a class="video-link" href="' + esc(safe) + '" target="_blank" rel="noopener">' +
          '<span class="video-start">▶ ' + esc(v.start) + "</span>" +
          '<span class="video-title">' + esc(v.title) + "</span></a>" +
          '<span class="video-meta">' + esc([v.channel, names[v.concept_id]].filter(Boolean).join(" · ")) + "</span>" +
          (v.why ? '<p class="video-why">' + rich(v.why) + "</p>" : "") +
          "</li>"
        );
      }).join("") + "</ol></section>"
    );
  }

  // Social logos (Simple Icons, CC0). Both use currentColor.
  var LOGO_LI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
  var LOGO_X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>';
  // Every post ends with a link to teach, so readers can make their own lessons.
  function withRepoLink(text) {
    text = String(text || "").replace(/\s+$/, "");
    return text.indexOf(REPO_URL.replace(/^https:\/\//, "")) >= 0 ? text : text + "\n\n" + REPO_URL;
  }
  function shareCard(id, cls, logo, name, sub, text, open) {
    return (
      '<article class="share-card ' + cls + '">' +
      '<header class="sc-head"><span class="sc-logo">' + logo + '</span><span class="sc-title"><b>' + name + "</b><span>" + sub + "</span></span>" +
      '<span class="count" id="' + id + '-count"></span></header>' +
      '<div class="sc-post"><div class="sc-author"><span class="sc-avatar" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="12.5" r="5.5"/><path d="M5.5 28.5c1.6-5.6 5.6-8.5 10.5-8.5s8.9 2.9 10.5 8.5"/></svg></span><span><b>You</b><span>Now · your post</span></span></div>' +
      '<textarea id="' + id + '" aria-label="' + name + ' post" spellcheck="true">' + esc(withRepoLink(text)) + "</textarea></div>" +
      '<div class="btn-row"><a class="btn sc-go" id="' + id + '-open" target="_blank" rel="noopener">' + logo + open + '</a><button type="button" class="btn" data-copy="' + id + '">Copy text</button></div>' +
      "</article>"
    );
  }

  function shareSection() {
    var s = lesson.share || {};
    if (!s.linkedin && !s.x) return "";
    return (
      '<section class="block" id="share" data-nav="Share">' +
      '<div class="sec-head"><span class="sec-num">Share</span><h2>Tell people what you learned</h2></div>' +
      '<div class="share-grid">' +
      (s.linkedin ? shareCard("share-li", "li", LOGO_LI, "LinkedIn", "Post to your network", s.linkedin, "Post on LinkedIn") : "") +
      (s.x ? shareCard("share-x", "x", LOGO_X, "X", "Post to your followers", s.x, "Post on X") : "") +
      "</div>" +
      '<p class="share-repo">Make lessons like this from your own chats: <a href="' + REPO_URL + '" target="_blank" rel="noopener">github.com/GrowthX-Club/teach</a></p>' +
      "</section>"
    );
  }

  function moreSection() {
    if (!thisDir) return "";
    var others = (window.LIBRARY || []).filter(function (it) { return it && it.dir && it.dir !== thisDir && it.lesson; })
      .sort(function (a, b) { return a.dir < b.dir ? 1 : -1; });
    if (!others.length) return "";
    return (
      '<section class="block" id="more" data-nav="More lessons">' +
      '<div class="sec-head"><span class="sec-num">More</span><h2>Your other lessons</h2></div>' +
      '<ol class="lib-list">' + others.slice(0, 6).map(function (it) {
        var m = it.lesson.meta || {};
        var tags = (areaNames[m.domain] ? '<span class="tag area">' + esc(areaNames[m.domain]) + "</span>" : "") +
          (it.lesson.concepts || []).map(function (c) { return '<span class="tag">' + esc(plain(c.name)) + "</span>"; }).join("");
        return '<li><a class="lib-row" href="../' + encodeURIComponent(it.dir) + '/index.html">' +
          (m.created ? '<span class="lib-meta">' + esc(m.created) + "</span>" : "") +
          "<h3>" + esc(plain(m.title)) + "</h3>" +
          (tags ? '<span class="tags">' + tags + "</span>" : "") + "</a></li>";
      }).join("") + "</ol>" +
      (others.length > 6 ? '<a class="btn" href="../../index.html" style="margin-top:12px">See all ' + (others.length + 1) + " lessons</a>" : "") +
      "</section>"
    );
  }

  // Overall feedback, right after the quiz. Per-section boxes are added after render (see feedback below).
  function feedbackSection() {
    return (
      '<section class="block" id="feedback" data-nav="Feedback">' +
      '<div class="sec-head"><span class="sec-num">Feedback</span><h2>How was this lesson?</h2></div>' +
      '<div class="feedback overall" data-feedback="lesson"></div>' +
