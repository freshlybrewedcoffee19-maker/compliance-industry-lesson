  // ---------- jargon tooltips ----------
  // Underline the first use of each glossary term per section; hover, focus or tap shows the tip.
  (function applyGlossary() {
    var glossary = (lesson.glossary || []).filter(function (g) { return g && g.term && g.tip; })
      .sort(function (a, b) { return b.term.length - a.term.length; });
    if (!glossary.length) return;
    var reEsc = function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); };
    var scopes = document.querySelectorAll(".hero, section.block[id^='c-']");
    scopes.forEach(function (scope) {
      var used = {};
      var walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
        acceptNode: function (n) {
          var p = n.parentElement;
          if (!p || p.closest("h1, h2, h3, .eyebrow, .term, code, pre, button, figure, .feedback")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function (node) {
        glossary.forEach(function (g) {
          var key = g.term.toLowerCase();
          if (used[key] || !node.parentNode) return;
          var m = new RegExp("\\b" + reEsc(g.term) + "\\b", "i").exec(node.nodeValue);
          if (!m) return;
          used[key] = true;
          var after = node.splitText(m.index);
          var rest = after.splitText(m[0].length);
          var span = document.createElement("span");
          span.className = "term";
          span.tabIndex = 0;
          span.setAttribute("data-tip", g.tip);
          span.setAttribute("aria-label", m[0] + ": " + g.tip);
          span.textContent = m[0];
          after.parentNode.replaceChild(span, after);
          node = rest;
        });
      });
    });

    var tip = document.createElement("div");
    tip.className = "term-tip";
    tip.setAttribute("role", "tooltip");
    tip.hidden = true;
    document.body.appendChild(tip);
    var current = null;
    function show(el) {
      current = el;
      tip.textContent = el.getAttribute("data-tip");
      tip.hidden = false;
      var r = el.getBoundingClientRect();
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
      var top = r.top - h - 10 < 8 ? r.bottom + 10 : r.top - h - 10;
      tip.style.left = left + "px";
      tip.style.top = top + "px";
    }
    function hide() { current = null; tip.hidden = true; }
    document.querySelectorAll(".term").forEach(function (el) {
      el.addEventListener("mouseenter", function () { show(el); });
      el.addEventListener("mouseleave", hide);
      el.addEventListener("focus", function () { show(el); });
      el.addEventListener("blur", hide);
      el.addEventListener("click", function (e) { e.stopPropagation(); current === el ? hide() : show(el); });
      el.addEventListener("mouseenter", function () { seenHint("terms"); });
      el.addEventListener("click", function () { seenHint("terms"); });
    });
    document.addEventListener("click", hide);
    addEventListener("scroll", function () { if (current) show(current); }, { passive: true });
  })();

  // Find the quote inside its section (whitespace-insensitive) and wrap each piece in <mark>.

    if (!section || !quote || document.querySelector('mark.asked[data-q="' + id + '"]')) return;

  document.addEventListener("selectionchange", function () { clearTimeout(updatePop.t); updatePop.t = setTimeout(updatePop, 350); });
  pop.addEventListener("mousedown", function (e) { e.preventDefault(); });
  pop.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || !picked) return;

    pop.hidden = true;
    seenHint("ask");
    openPanel();
    setQuote(p);
    if (b.getAttribute("data-act") === "simple") send("Can you explain this part more simply?");
    else input.focus();
  });

  // ---------- reading progress ----------
  var bar = document.getElementById("progress");
  function onScroll() {
    var max = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (max > 0 ? Math.min(100, (scrollY / max) * 100) : 100) + "%";
    updateSidebar();

  addEventListener("scroll", onScroll, { passive: true });

<script>(function(){const d={"intro":"\u003cdiv class=\"foundation-intro\">\u003cp>\u003ca href=\"../course/\">Your six-part course\u003c/a>\u003c/p>\u003ch2>Compliance in India, from zero\u003c/h2>\u003cp>A detailed foundation for developing Perimattic’s service. Start with the three animated ideas below, then work through the guide. You do not need prior technical knowledge.\u003c/p>\u003cp>The core lesson takes about eight minutes; the detailed guide and practice take longer. Read at your own pace.\u003c/p>\u003cdetails>\u003csummary>See the detailed learning path\u003c/summary>\u003col>\u003cli>\u003ca href=\"#guide-information\">1. List the information the business holds\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-differences\">2. Security, privacy, and compliance\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-requirements\">3. Who says you must do it?\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-india\">4. India has several layers of rules\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-privacy-dates\">5. Check when personal information duties begin\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-frameworks\">6. Find out which result the customer needs\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-building-blocks\">7. Six building blocks, one leaving employee\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-teams\">8. Give each team a clear job\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-delivery\">9. Take a client from questions to dated proof\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-position\">10. What Perimattic could offer\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-starter\">11. Start with a small paid preparation check\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-buyer\">12. Test your idea of who might buy\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-finding\">13. Find out whether anyone wants to buy\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-money\">14. Work out what is left after costs\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guide-month\">15. Plan the first month and set limits\u003c/a>\u003c/li>\u003c/ol>\u003c/details>\u003c/div>","guide":"\u003csection class=\"block foundation-section\" id=\"guide-information\" data-nav=\"1. List the information the business holds\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 1\u003c/span>\u003ch2>1. List the information the business holds\u003c/h2>\u003c/div>\u003cp>Imagine Tara's 30-person Indian software business. It holds employee bank details, customer names, support messages, invoices, and passwords that open its systems. Some information identifies a person. Some is a customer's business secret. Some, such as a password, lets someone act inside the service. Each kind needs a reason for being collected and an owner who can answer questions about it.\u003c/p>\u003cp>Walk through one customer journey: someone signs up, pays, asks for help, and later leaves. Where does their information go? Who can read it? Which supplier keeps a copy? What happens if it disappears, changes, or reaches the wrong person? Those are practical risk questions. Start with a plain list and a drawing of the journey. Use made-up records while practising. Real customer information requires authorisation and an agreed handling process.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a> · \u003ca href=\"https://commission.europa.eu/law/law-topic/data-protection/data-protection-explained_en\" target=\"_blank\" rel=\"noopener\">European data protection explained\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-differences\" data-nav=\"2. Security, privacy, and compliance\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 2\u003c/span>\u003ch2>2. Security, privacy, and compliance\u003c/h2>\u003c/div>\u003cp>Security asks whether information and systems are protected against harm. A locked account helps prevent an outsider reading support messages. A backup, a spare recoverable copy, helps when information is lost. Privacy asks whether the business should collect a person's information, what it tells them, how it uses that information, and how it handles their rights.\u003c/p>\u003cp>Compliance asks whether applicable requirements are being met. A contract might require departing employees to lose access within an agreed time. A law might impose duties concerning people's information. A customer might ask for an independent report before signing. These are related questions with different answers. A business can protect a database, an organised store of information, well while collecting information it has no proper reason to use. It can also have a handsome policy document while leaving old accounts open. Ask all three questions instead of treating one certificate as proof of everything.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a> · \u003ca href=\"https://commission.europa.eu/law/law-topic/data-protection/data-protection-explained_en\" target=\"_blank\" rel=\"noopener\">European data protection explained\u003c/a> · \u003ca href=\"https://www.meity.gov.in/documents/act-and-policies/digital-personal-data-protection-rules-2025-gDOxUjMtQWa?pageTitle=Digital-Personal-Data-Protection-Rules-2025%3B\" target=\"_blank\" rel=\"noopener\">Personal data rules and commencement notices\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-requirements\" data-nav=\"3. Who says you must do it?\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 3\u003c/span>\u003ch2>3. Who says you must do it?\u003c/h2>\u003c/div>\u003cp>A law is a legal rule made through the country's lawmaking process. A regulator is a public authority that supervises a particular area and may issue binding directions within its powers. A standard is an organised set of requirements or guidance. A contract is an agreement between parties, such as a customer and supplier. Keep those sources separate when writing a client's requirement list.\u003c/p>\u003cp>A standard can be voluntary in general while becoming a requirement of a particular customer contract. Certification is an outside body's formal confirmation against a specified standard and scope; it does not erase other duties. Ask who requires the item, which part of the business it covers, when it must be met, and what result they will accept. Have a qualified adviser check legal interpretation and a suitable assessor confirm assessment expectations before selling a particular outcome.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a> · \u003ca href=\"https://www.iso.org/certification.html\" target=\"_blank\" rel=\"noopener\">ISO certification explained\u003c/a> · \u003ca href=\"https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf\" target=\"_blank\" rel=\"noopener\">CERT-In directions\u003c/a> · \u003ca href=\"https://www.meity.gov.in/documents/act-and-policies/digital-personal-data-protection-rules-2025-gDOxUjMtQWa?pageTitle=Digital-Personal-Data-Protection-Rules-2025%3B\" target=\"_blank\" rel=\"noopener\">Personal data rules and commencement notices\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-india\" data-nav=\"4. India has several layers of rules\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 4\u003c/span>\u003ch2>4. India has several layers of rules\u003c/h2>\u003c/div>\u003cp>Information technology, shortened to IT, includes computers and software. India's IT Act provides the legal setting for directions from the Indian Computer Emergency Response Team, called CERT-In. Businesses and organisations covered by these directions must report the listed kinds of computer security incidents within six hours of noticing them or being told about them. The directions also address keeping relevant system logs, records of system activity, for 180 days. Read their India-location wording alongside the official questions and answers: question 35 permits logs outside India if they can be produced within reasonable time. This does not mean all customer information must be stored in India.\u003c/p>\u003cp>The Reserve Bank of India, called RBI, and the Securities and Exchange Board of India, called SEBI, supervise particular financial entities and activities. Their rules for the businesses they supervise do not automatically cover every startup. A supplier may receive related contractual requirements from a customer supervised by a regulator. Check both the customer's status and the actual agreement.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf\" target=\"_blank\" rel=\"noopener\">CERT-In directions\u003c/a> · \u003ca href=\"https://www.cert-in.org.in/PDF/FAQs_on_CyberSecurityDirections_May2022.pdf\" target=\"_blank\" rel=\"noopener\">CERT-In official questions and answers\u003c/a> · \u003ca href=\"https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx?id=12562\" target=\"_blank\" rel=\"noopener\">Reserve Bank information technology directions\u003c/a> · \u003ca href=\"https://www.sebi.gov.in/sebi_data/faqfiles/jun-2025/1749647139924.pdf\" target=\"_blank\" rel=\"noopener\">Securities regulator cybersecurity questions and answers\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-privacy-dates\" data-nav=\"5. Check when personal information duties begin\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 5\u003c/span>\u003ch2>5. Check when personal information duties begin\u003c/h2>\u003c/div>\u003cp>The Digital Personal Data Protection Act, shortened to DPDP Act, concerns digital information about people within its legal scope. The notices bringing the Act into force and the 2025 rules set different start dates for different provisions. As of 25 November 2026, most rules governing day-to-day duties are scheduled to begin in May 2027. Some parts have earlier start dates. Do not say every duty can already be enforced, or that the later timetable removes existing obligations under other law or contracts.\u003c/p>\u003cp>Preparation can begin with a list of the information the business holds, clear purposes, understandable notices, safeguards, and a plan for handling requests and incidents. Consent means a person's agreement. It is one route the Act allows for processing, or handling, their information; the Act also allows certain activities called legitimate uses. The General Data Protection Regulation, called GDPR, is the European Union's personal data law. Whether it applies depends on the places and activities the law covers, and what the business does. Ask a qualified legal adviser to check what is covered, who is responsible, and which dates apply.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.meity.gov.in/documents/act-and-policies/digital-personal-data-protection-rules-2025-gDOxUjMtQWa?pageTitle=Digital-Personal-Data-Protection-Rules-2025%3B\" target=\"_blank\" rel=\"noopener\">Personal data rules and commencement notices\u003c/a> · \u003ca href=\"https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf\" target=\"_blank\" rel=\"noopener\">Final personal data rules\u003c/a> · \u003ca href=\"https://commission.europa.eu/law/law-topic/data-protection/data-protection-explained_en\" target=\"_blank\" rel=\"noopener\">European data protection explained\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-frameworks\" data-nav=\"6. Find out which result the customer needs\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 6\u003c/span>\u003ch2>6. Find out which result the customer needs\u003c/h2>\u003c/div>\u003cp>ISO/IEC 27001 concerns an information security management system, meaning arrangements for choosing, running, checking, and improving safeguards. The certificate covers only the activities and systems included in its agreed boundaries. SOC 2 is an independent accountant's report on safeguards checked against selected requirements called trust services criteria. It is not an ISO certificate or a universal requirement simply because a buyer is American. Ask what that buyer actually needs.\u003c/p>\u003cp>Payment Card Industry, shortened to PCI, standards concern payment card security. Validation, the process of confirming that requirements are met, can use different official forms or checks depending on the business's role and the programme's rules. Sending checkout to another provider can reduce responsibilities, but does not automatically remove every obligation. Ask the organisation requesting validation which form or check it requires. DPDP and GDPR set legal duties, not commercial badges sold as substitutes for following law. Start with the required outcome, then select preparation work that supports it.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a> · \u003ca href=\"https://www.iso.org/certification.html\" target=\"_blank\" rel=\"noopener\">ISO certification explained\u003c/a> · \u003ca href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">Accountants: system and organization controls\u003c/a> · \u003ca href=\"https://www.pcisecuritystandards.org/faqs/1220/\" target=\"_blank\" rel=\"noopener\">Payment card validation forms\u003c/a> · \u003ca href=\"https://www.meity.gov.in/documents/act-and-policies/digital-personal-data-protection-rules-2025-gDOxUjMtQWa?pageTitle=Digital-Personal-Data-Protection-Rules-2025%3B\" target=\"_blank\" rel=\"noopener\">Personal data rules and commencement notices\u003c/a> · \u003ca href=\"https://commission.europa.eu/law/law-topic/data-protection/data-protection-explained_en\" target=\"_blank\" rel=\"noopener\">European data protection explained\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-building-blocks\" data-nav=\"7. Six building blocks, one leaving employee\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 7\u003c/span>\u003ch2>7. Six building blocks, one leaving employee\u003c/h2>\u003c/div>\u003cp>Scope is the boundary of the work: perhaps Tara's service used by customers, its staff, and supporting systems. An asset is something valuable, such as a laptop, account, or customer database. A risk is a possible harmful event, such as a former employee continuing to read customer information. Describe the harm as well as the event so the reason for fixing it stays clear.\u003c/p>\u003cp>A control reduces that risk: disable the person's accounts when employment ends. A policy states the rule, responsible person, and expected timing. Evidence shows what happened: an approved departure request, a dated closure record, and a check that access stopped. One screenshot may show only one system at one moment. Check all systems within scope and retain proof through an agreed process. This chain turns &quot;we take security seriously&quot; into work a manager and outside assessor can examine.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a> · \u003ca href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">Accountants: system and organization controls\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-teams\" data-nav=\"8. Give each team a clear job\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 8\u003c/span>\u003ch2>8. Give each team a clear job\u003c/h2>\u003c/div>\u003cp>The people team knows when someone joins, changes role, or leaves. The information technology team manages devices and many accounts. Engineers build the software and can change access, records, and backups. Procurement, the people who arrange supplier purchases, checks what suppliers are responsible for. Legal advisers interpret law and contracts. Management approves priorities, spending, and risks the business chooses to accept.\u003c/p>\u003cp>Give each action one named owner, one due date, and a person who checks completion. For Tara's departing employee, the people team starts the request, account owners remove access, and a reviewer checks completion. A consultant can organise the process, but cannot quietly accept a business risk on management's behalf. If a critical change could interrupt the service, agree how it will be tested and approved first. A shared action list helps everyone see what remains open and who needs help.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-delivery\" data-nav=\"9. Take a client from questions to dated proof\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 9\u003c/span>\u003ch2>9. Take a client from questions to dated proof\u003c/h2>\u003c/div>\u003cp>Begin the first client call by asking what triggered the request, who wants the result, and by when. Agree scope and obtain permission before examining systems. Compare current arrangements with applicable requirements. Produce a gap list, meaning a list of missing or weak arrangements, with owners, priorities, and an explanation of possible harm. Separate urgent problems in day-to-day work from paperwork that can wait.\u003c/p>\u003cp>Help owners put agreed safeguards into use. Collect dated proof as processes run; do not invent records suggesting past work occurred. Check a sample of the records, explain remaining weaknesses, and let management approve decisions. If independent assessment is required, a qualified outside assessor checks the agreed scope and issues its own findings. Plan time for corrections. Maintain access reviews, supplier checks, practice sessions for responding to security problems, and other agreed routines afterward. The schedule follows requirements and risk, rather than a promise that one project makes the business compliant forever.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a> · \u003ca href=\"https://www.iso.org/certification.html\" target=\"_blank\" rel=\"noopener\">ISO certification explained\u003c/a> · \u003ca href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">Accountants: system and organization controls\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-position\" data-nav=\"10. What Perimattic could offer\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 10\u003c/span>\u003ch2>10. What Perimattic could offer\u003c/h2>\u003c/div>\u003cp>Perimattic could explore preparation and implementation: helping a business understand requests, organise evidence, assign work, and make agreed engineering changes. Its public website provides background for considering a service built around engineering work. It does not by itself prove assessment authority, staff qualifications, completed projects helping clients meet requirements, or permission to issue a particular result. This is a possible service design to validate, not a claim about qualifications or authority it already holds.\u003c/p>\u003cp>Separate three roles in a proposal. An adviser helps interpret and plan. An implementer changes systems and processes with customer approval. An independent assessor examines the result under the professional rules that apply to its work. Writing policies does not establish authority to issue certificates or reports. Build a relationship with a qualified specialist before offering work your team has not done before. Explain who does what, who reviews delivery, and who issues any formal outcome. Make claims specific enough that a prospective customer can check them.\u003c/p>\u003cdiv class=\"foundation-table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Who\u003c/th>\u003cth>Their part\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Perimattic and its qualified delivery expert\u003c/td>\u003ctd>Agree scope, identify gaps, help put safeguards into use, and organise truthful evidence.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Customer management and staff\u003c/td>\u003ctd>Approve scope and spending, make business decisions, provide records, and operate the agreed processes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Independent assessor\u003c/td>\u003ctd>Examine the defined scope, raise findings, and decide the formal assessment outcome under the applicable scheme.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://perimattic.com/\" target=\"_blank\" rel=\"noopener\">Perimattic public website\u003c/a> · \u003ca href=\"https://www.iso.org/certification.html\" target=\"_blank\" rel=\"noopener\">ISO certification explained\u003c/a> · \u003ca href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">Accountants: system and organization controls\u003c/a> · \u003ca href=\"https://www.pcisecuritystandards.org/assessors_and_solutions/qualified_security_assessors/\" target=\"_blank\" rel=\"noopener\">Qualified security assessors\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-starter\" data-nav=\"11. Start with a small paid preparation check\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 11\u003c/span>\u003ch2>11. Start with a small paid preparation check\u003c/h2>\u003c/div>\u003cp>A starter offer could be a readiness review with agreed boundaries, a check of how prepared a business is for one named customer requirement. Deliver a scope statement, an information and system inventory, a requirement list, a list of missing or weak arrangements ranked by urgency, an action plan naming who will do each task and by when, and an evidence checklist. Include a closing conversation so management understands decisions rather than receiving an unexplained folder.\u003c/p>\u003cp>State exclusions: no legal opinion, no certification, no independent accountant's report, no testing that probes or could disrupt systems, and no guaranteed assessment pass. Changes to live systems need separate agreement and approval. Arrange qualified expert review of requirement interpretation, sample evidence, and recommendations. This lesson gives a beginner a map; it does not qualify them to provide specialist opinions about whether requirements have been met. Price the workload, including expert review. Agree how extra systems or changed customer requests affect the work before starting.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a> · \u003ca href=\"https://www.iso.org/certification.html\" target=\"_blank\" rel=\"noopener\">ISO certification explained\u003c/a> · \u003ca href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">Accountants: system and organization controls\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-buyer\" data-nav=\"12. Test your idea of who might buy\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 12\u003c/span>\u003ch2>12. Test your idea of who might buy\u003c/h2>\u003c/div>\u003cp>An ideal customer profile, shortened to ICP, describes the kind of buyer you think may need the offer, so you can test that idea. Your first idea to test could be an Indian business selling software to other businesses, called B2B, with 20 to 100 staff, working engineers, no dedicated compliance owner, and a current requirement from a large customer. Add a real deadline and plausible budget. These features are assumptions, not evidence of demand.\u003c/p>\u003cp>The buyer might be a founder or chief technology officer, called CTO, who leads technology decisions. Ask who owns the customer deal, who approves spending, and who will supply evidence. A vague wish for a badge may need education rather than a paid project. A named requirement, person responsible for moving the project forward, available staff, and deadline make the situation easier to evaluate. Revise the profile when conversations show another group has a clearer problem and ability to buy.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://perimattic.com/\" target=\"_blank\" rel=\"noopener\">Perimattic public website\u003c/a> · \u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-finding\" data-nav=\"13. Find out whether anyone wants to buy\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 13\u003c/span>\u003ch2>13. Find out whether anyone wants to buy\u003c/h2>\u003c/div>\u003cp>Start with existing client relationships and partners who know Perimattic's engineering work. Referral partners might include qualified security advisers and accounting firms, provided roles and independence are handled correctly. Research 30 possible customer businesses using public information and lawful sources. Record why each appears relevant, the likely buyer, and what remains unknown. Public clues are starting points for questions, not proof of security weaknesses.\u003c/p>\u003cp>Aim for ten discovery conversations, meaning discussions to understand a possible customer's problem. Ask: What exact request arrived? Which deal or deadline depends on it? What have you tried? Who can make changes? Who approves payment? What outcome would count as useful? Ask permission before viewing confidential documents. Look for repeated problems and willingness to buy a review with agreed boundaries. This is a research plan, not a guarantee of clients, and does not authorise sending outreach or messages on anyone's behalf.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://perimattic.com/\" target=\"_blank\" rel=\"noopener\">Perimattic public website\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-money\" data-nav=\"14. Work out what is left after costs\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 14\u003c/span>\u003ch2>14. Work out what is left after costs\u003c/h2>\u003c/div>\u003cp>For learning only, imagine a readiness review priced at ₹30,000 to ₹50,000. This range is an untested assumption, not verified Indian market pricing or a recommended quote. A real proposal needs scope, staff effort, expert review, support, and payment terms. Speak with buyers and qualified delivery partners before deciding whether any price is credible.\u003c/p>\u003cp>Imagine an implementation project brings in ₹3,00,000. An implementer costs ₹1,50,000 and other delivery expenses cost ₹20,000. That leaves ₹1,30,000 before valuing the owner's work. Suppose the owner spends 60 hours and values each at ₹1,000: another ₹60,000. The remaining ₹70,000 is before general business expenses, tax, and sales costs. It is not take-home profit. Delays, rework, expert review, or unpaid invoices can reduce it further. Write assumptions beside the calculation and update them after a pilot, a small first project testing the offer.\u003c/p>\u003cdiv class=\"foundation-table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Illustrative item\u003c/th>\u003cth>Amount\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Project revenue\u003c/td>\u003ctd>₹3,00,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Less: implementer\u003c/td>\u003ctd>₹1,50,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Less: other delivery expenses\u003c/td>\u003ctd>₹20,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Remaining before owner time\u003c/td>\u003ctd>₹1,30,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Less: owner time, 60 hours × ₹1,000\u003c/td>\u003ctd>₹60,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Remaining before overhead, tax and sales costs\u003c/td>\u003ctd>₹70,000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://perimattic.com/\" target=\"_blank\" rel=\"noopener\">Perimattic public website\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"block foundation-section\" id=\"guide-month\" data-nav=\"15. Plan the first month and set limits\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Guide 15\u003c/span>\u003ch2>15. Plan the first month and set limits\u003c/h2>\u003c/div>\u003cp>In week one, learn the chosen requirement with a qualified expert and practise using fictional evidence. In week two, research accounts and start ten buyer conversations. In week three, compare needs, effort, expert availability, and payment expectations. In week four, propose a small paid pilot with written scope and work that a qualified expert has checked. These are planned activities, not guaranteed commercial results.\u003c/p>\u003cp>Do not claim to be a Qualified Security Assessor, called QSA, without the relevant payment card programme authorisation. Do not imply ISO itself certifies clients. A Certified Public Accountant, called CPA, is a qualified accounting professional; the appropriate independent accounting firm issues a SOC 2 report. The United States Health Insurance Portability and Accountability Act, called HIPAA, has no official government certification substituting for compliance. Keep these limits visible in sales material. Next, choose one requirement and one pilot reviewed by a qualified expert, then test whether buyers value it.\u003c/p>\u003cp class=\"foundation-sources\">Sources: \u003ca href=\"https://www.pcisecuritystandards.org/assessors_and_solutions/qualified_security_assessors/\" target=\"_blank\" rel=\"noopener\">Qualified security assessors\u003c/a> · \u003ca href=\"https://www.iso.org/certification.html\" target=\"_blank\" rel=\"noopener\">ISO certification explained\u003c/a> · \u003ca href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">Accountants: system and organization controls\u003c/a> · \u003ca href=\"https://www.hhs.gov/hipaa/for-professionals/faq/are-we-required-to-certify-our-organizations-compliance-with-the-standards/index.html\" target=\"_blank\" rel=\"noopener\">United States health privacy certification question\u003c/a>\u003c/p>\u003c/section>","dictionary":"\u003csection class=\"block foundation-section\" id=\"dictionary\" data-nav=\"Plain-language dictionary\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Look up\u003c/span>\u003ch2>Plain-language dictionary\u003c/h2>\u003c/div>\u003cdiv class=\"foundation-table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Asset\u003c/td>\u003ctd>Something valuable to protect, such as a laptop, account, customer record, or business process.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Risk\u003c/td>\u003ctd>A possible harmful event and its consequences, such as an old account exposing customer information.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Control\u003c/td>\u003ctd>A safeguard that reduces risk, such as closing a departing employee's account.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Policy\u003c/td>\u003ctd>A written rule explaining what must happen and who is responsible.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Evidence\u003c/td>\u003ctd>Checkable proof of an action or condition, with enough context and dates to understand it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scope\u003c/td>\u003ctd>The exact services, people, places, and systems included in the work.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security\u003c/td>\u003ctd>Protection of information and systems against harm, loss, misuse, or disruption.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Privacy\u003c/td>\u003ctd>Appropriate handling of information about people, including purposes, notices, safeguards, and relevant rights.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Compliance\u003c/td>\u003ctd>Meeting the requirements that actually apply to the business or agreed scope.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Law\u003c/td>\u003ctd>A legal rule; whether it applies depends on the rule and the business's circumstances.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regulator\u003c/td>\u003ctd>A public authority supervising an area, with powers defined by law.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Standard\u003c/td>\u003ctd>An organised set of requirements or guidance, which may become part of a contract.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contract\u003c/td>\u003ctd>An agreement between parties that can create specific duties, deadlines, and remedies.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Certification\u003c/td>\u003ctd>A certification body's confirmation against a specified standard and scope; it does not settle every legal question.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Readiness review\u003c/td>\u003ctd>A preparation check identifying gaps before the required formal assessment or customer decision.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Independent assessment\u003c/td>\u003ctd>An outside qualified party examines an agreed subject and reaches its own conclusion.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gap register\u003c/td>\u003ctd>A list of missing or weak arrangements, with priorities, owners, and planned actions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Personal data\u003c/td>\u003ctd>Information about a person who can be identified from it or with other relevant information.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>System log\u003c/td>\u003ctd>A record of events in a computer system, useful for investigating what happened.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ideal customer profile\u003c/td>\u003ctd>A testable description of buyers with a particular problem, buying ability, and reasons to act.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Margin\u003c/td>\u003ctd>The amount left after specified costs; say which costs are included before treating it as profit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pilot\u003c/td>\u003ctd>A small, clearly bounded first engagement used to test the offer and delivery assumptions.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>","practice":"\u003csection class=\"block foundation-section\" id=\"india-practice\" data-nav=\"Try the Indian examples\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Practice\u003c/span>\u003ch2>Can you tell the requirements apart?\u003c/h2>\u003c/div>\u003cp>Try these after reading the guide. You can change your answers and check again.\u003c/p>\u003cfieldset>\u003clegend>An enterprise customer says: “Show us ISO 27001 certification before we buy.” What creates this buying condition?\u003c/legend>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-0\" value=\"0\">A customer or contractual requirement\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-0\" value=\"1\">A universal Indian law requiring every company to be certified\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-0\" value=\"2\">A promise that certification prevents every attack\u003c/label>\u003c/fieldset>\u003cfieldset>\u003clegend>A covered organisation discovers a specified reportable incident under CERT-In’s directions. What should its team consult?\u003c/legend>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-1\" value=\"0\">Only its marketing checklist\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-1\" value=\"1\">The applicable reporting directions, official clarifications and response procedure\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-1\" value=\"2\">Its logo designer\u003c/label>\u003c/fieldset>\u003cfieldset>\u003clegend>Perimattic helps implement safeguards. Who retains responsibility for the customer’s business decisions and operating practices?\u003c/legend>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-2\" value=\"0\">The customer’s management\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-2\" value=\"1\">The certificate designer\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"india-case-2\" value=\"2\">The software dashboard\u003c/label>\u003c/fieldset>\u003cbutton class=\"btn\" id=\"check-india-cases\" type=\"button\">Check my answers\u003c/button>\u003cdiv id=\"india-case-result\" role=\"status\" hidden>\u003c/div>\u003c/section>","sources":"\u003csection class=\"block foundation-section\" id=\"sources\" data-nav=\"Original sources\">\u003cdiv class=\"sec-head\">\u003cspan class=\"sec-num\">Read\u003c/span>\u003ch2>Original sources\u003c/h2>\u003c/div>\u003cp>Reviewed 25 November 2026. Official sources explain obligations and assessment rules. Company pages describe their own services. Service offers, customer profiles and price examples here are hypotheses or planning examples, not verified promises.\u003c/p>\u003col>\u003cli>\u003ca href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO information security standard\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.iso.org/certification.html\" target=\"_blank\" rel=\"noopener\">ISO certification explained\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf\" target=\"_blank\" rel=\"noopener\">CERT-In directions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.cert-in.org.in/PDF/FAQs_on_CyberSecurityDirections_May2022.pdf\" target=\"_blank\" rel=\"noopener\">CERT-In official questions and answers\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.meity.gov.in/documents/act-and-policies/digital-personal-data-protection-rules-2025-gDOxUjMtQWa?pageTitle=Digital-Personal-Data-Protection-Rules-2025%3B\" target=\"_blank\" rel=\"noopener\">Personal data rules and commencement notices\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf\" target=\"_blank\" rel=\"noopener\">Final personal data rules\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx?id=12562\" target=\"_blank\" rel=\"noopener\">Reserve Bank information technology directions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.sebi.gov.in/sebi_data/faqfiles/jun-2025/1749647139924.pdf\" target=\"_blank\" rel=\"noopener\">Securities regulator cybersecurity questions and answers\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">Accountants: system and organization controls\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.pcisecuritystandards.org/faqs/1220/\" target=\"_blank\" rel=\"noopener\">Payment card validation forms\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.pcisecuritystandards.org/assessors_and_solutions/qualified_security_assessors/\" target=\"_blank\" rel=\"noopener\">Qualified security assessors\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://perimattic.com/\" target=\"_blank\" rel=\"noopener\">Perimattic public website\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://commission.europa.eu/law/law-topic/data-protection/data-protection-explained_en\" target=\"_blank\" rel=\"noopener\">European data protection explained\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.hhs.gov/hipaa/for-professionals/faq/are-we-required-to-certify-our-organizations-compliance-with-the-standards/index.html\" target=\"_blank\" rel=\"noopener\">United States health privacy certification question\u003c/a>\u003c/li>\u003c/ol>\u003cp>\u003ca class=\"btn\" href=\"../course/\">Continue to the six-part course\u003c/a>\u003c/p>\u003cp>\u003ca href=\"../course/choose-first-offering/index.html#capstone\">Draft your first service offer\u003c/a>\u003c/p>\u003c/section>","cases":[{"q":"An enterprise customer says: “Show us ISO 27001 certification before we buy.” What creates this buying condition?","options":["A customer or contractual requirement","A universal Indian law requiring every company to be certified","A promise that certification prevents every attack"],"answer":0,"why":"The buyer is setting a condition. ISO 27001 is the standard used for assessment; it is not automatically a universal legal certification duty."},{"q":"A covered organisation discovers a specified reportable incident under CERT-In’s directions. What should its team consult?","options":["Only its marketing checklist","The applicable reporting directions, official clarifications and response procedure","Its logo designer"],"answer":1,"why":"The applicable directions and clarifications determine reporting duties. A certificate or sales claim cannot replace incident handling."},{"q":"Perimattic helps implement safeguards. Who retains responsibility for the customer’s business decisions and operating practices?","options":["The customer’s management","The certificate designer","The software dashboard"],"answer":0,"why":"The provider can advise and carry out agreed tasks. Customer management still approves decisions, provides resources and owns the organisation’s practices."}],"refs":[{"id":"compliance-foundations","refs":[0,1]},{"id":"working-safeguards","refs":[0]},{"id":"independent-assessment","refs":[8,1]}],"sourceList":[{"title":"ISO information security standard","url":"https://www.iso.org/standard/27001"},{"title":"ISO certification explained","url":"https://www.iso.org/certification.html"},{"title":"CERT-In directions","url":"https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf"},{"title":"CERT-In official questions and answers","url":"https://www.cert-in.org.in/PDF/FAQs_on_CyberSecurityDirections_May2022.pdf"},{"title":"Personal data rules and commencement notices","url":"https://www.meity.gov.in/documents/act-and-policies/digital-personal-data-protection-rules-2025-gDOxUjMtQWa?pageTitle=Digital-Personal-Data-Protection-Rules-2025%3B"},{"title":"Final personal data rules","url":"https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf"},{"title":"Reserve Bank information technology directions","url":"https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx?id=12562"},{"title":"Securities regulator cybersecurity questions and answers","url":"https://www.sebi.gov.in/sebi_data/faqfiles/jun-2025/1749647139924.pdf"},{"title":"Accountants: system and organization controls","url":"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services"},{"title":"Payment card validation forms","url":"https://www.pcisecuritystandards.org/faqs/1220/"},{"title":"Qualified security assessors","url":"https://www.pcisecuritystandards.org/assessors_and_solutions/qualified_security_assessors/"},{"title":"Perimattic public website","url":"https://perimattic.com/"},{"title":"European data protection explained","url":"https://commission.europa.eu/law/law-topic/data-protection/data-protection-explained_en"},{"title":"United States health privacy certification question","url":"https://www.hhs.gov/hipaa/for-professionals/faq/are-we-required-to-certify-our-organizations-compliance-with-the-standards/index.html"}]},main=document.querySelector('main.content');const intro=document.createElement('div');intro.innerHTML=d.intro;main.prepend(intro);const shell=document.createElement('div');shell.innerHTML=d.guide+d.dictionary+d.practice+d.sources;const quiz=main.querySelector('#quiz');while(shell.firstChild)main.insertBefore(shell.firstChild,quiz);for(const c of d.refs){const sec=document.getElementById('c-'+c.id);if(!sec)continue;const p=document.createElement('p');p.className='foundation-sources';p.append('Sources: ');c.refs.forEach((idx,i)=>{const s=d.sourceList[idx];if(!s)return;if(i)p.append(' · ');const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=s.title;p.append(a);});sec.append(p);}const side=document.querySelector('#sidebar ol');if(side){for(const sec of main.querySelectorAll('.foundation-section[data-nav]')){const li=document.createElement('li'),a=document.createElement('a');a.href='#'+sec.id;a.textContent=sec.dataset.nav;li.append(a);side.append(li);}}document.getElementById('check-india-cases').addEventListener('click',()=>{const picks=d.cases.map((_,i)=>document.querySelector('input[name="india-case-'+i+'"]:checked'));const out=document.getElementById('india-case-result');out.hidden=false;if(picks.some(p=>!p)){out.textContent='Choose an answer for all three situations first.';return;}const score=picks.filter((p,i)=>Number(p.value)===d.cases[i].answer).length;out.textContent=score+' of 3 correct. '+d.cases.map((c,i)=>(i+1)+'. '+c.why).join(' ');});})();</script></body>
