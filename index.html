  // Hint 2: the tutor, once the reader is into the first concept and hint 1 is done.
  function maybeAskHint() {
    if (hintSeen("ask") || (firstTerm && !hintSeen("terms"))) return;
    var firstConcept = document.querySelector("section.block[id^='c-']");
    if (firstConcept && firstConcept.getBoundingClientRect().top < innerHeight * 0.5) {
      if (showCoach("ask", "<b>Stuck on something?</b> Select any text and tap <b>Ask about this</b>, or open the tutor below. You get a plain-words answer right here.", null, { corner: true, big: true, demo: true })) {
        fab.classList.add("pulse");
      }
    }
  }
  addEventListener("scroll", maybeAskHint, { passive: true });

  // ---------- lesson tutor (chat) ----------
  // With the teach lesson server (http://localhost) questions are answered right
  // here by Claude Code on this computer. Opened as a plain file, the same panel
  // copies the question so it can be pasted into the Claude chat instead.
  var lessonDir = (location.pathname.match(/\/lessons\/([a-z0-9-]+)\//) || [])[1] || "";
  var chatLive = false;
  var thread = [];
  var pendingQuote = null;
  var waiting = false;
  var localKey = storeKey + ":questions";

  var fab = document.createElement("button");
  fab.type = "button";
  fab.className = "tutor-fab";
  fab.setAttribute("aria-label", "Ask the lesson tutor");
  fab.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.4c-.5.4-1.3 0-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="currentColor"/><circle cx="8.5" cy="9.5" r="1.2" fill="var(--brand)"/><circle cx="12" cy="9.5" r="1.2" fill="var(--brand)"/><circle cx="15.5" cy="9.5" r="1.2" fill="var(--brand)"/></svg><span class="tutor-dot" hidden></span>';
  document.body.appendChild(fab);

  var panel = document.createElement("section");
  panel.className = "tutor";
  panel.hidden = true;
  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-label", "Lesson tutor");
  panel.innerHTML =
    '<div class="tutor-resize" role="separator" aria-orientation="vertical" aria-label="Resize tutor panel" tabindex="0"></div>' +
    '<header class="tutor-head">' +
    '<div class="tutor-title"><b>Lesson tutor</b></div>' +
    '<button type="button" class="tutor-x" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>' +
    '<div class="tutor-body" id="tutor-body" aria-live="polite"></div>' +
    '<div class="tutor-compose">' +
    '<div class="tutor-quote" hidden><span class="tq-label">Asking about</span><q></q><button type="button" aria-label="Remove passage">×</button></div>' +
    '<form class="tutor-form"><label class="sr-only" for="tutor-input">Your question</label>' +
    '<textarea id="tutor-input" rows="1" placeholder="Ask anything about this lesson…"></textarea>' +
    '<button type="submit" class="tutor-send" aria-label="Copy question"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form></div>' +
    '<p class="tutor-foot" id="tutor-foot"></p>';
  document.body.appendChild(panel);
  var body = panel.querySelector("#tutor-body");
  var input = panel.querySelector("#tutor-input");
  var quoteBox = panel.querySelector(".tutor-quote");

  function md(s) {
    var blocks = String(s || "").trim().split(/\n{2,}/);
    var bullet = /^\s*([-*•]|\d+\.)\s+/;
    return blocks.map(function (b) {
      // Group consecutive bullet lines into a list and other lines into a paragraph.
      var out = "", para = [], items = [];
      function flush() {
        if (para.length) out += "<p>" + rich(para.join(" ")) + "</p>";
        if (items.length) out += "<ul>" + items.map(function (l) { return "<li>" + rich(l) + "</li>"; }).join("") + "</ul>";
        para = []; items = [];
      }
      b.split("\n").forEach(function (l) {
        if (bullet.test(l)) { if (para.length) flush(); items.push(l.replace(bullet, "")); }
        else { if (items.length) flush(); para.push(l); }
      });
      flush();
      return out;
    }).join("");
  }
  function scrollBottom() { body.scrollTop = body.scrollHeight; }
  function renderEmpty() {
    if (thread.length) return;
    body.innerHTML =
      '<div class="tutor-hello"><h2>What can I explain?</h2><p>Type a question about this lesson, then copy it into your AI chat for an explanation.</p>' +
      '<p class="tutor-tip">Tip: select any text in the lesson and tap <b>Ask about this</b>.</p>' +
      '<div class="tutor-chips">' + ["Explain the main idea more simply", "Give me another real-life example", "How does this connect to my work?"].map(function (t) {
        return '<button type="button" class="tutor-chip">' + esc(t) + "</button>";
      }).join("") + "</div></div>";
    body.querySelectorAll(".tutor-chip").forEach(function (b) { b.addEventListener("click", function () { send(b.textContent); }); });
  }
  function addTurn(q, answerHtml, opts) {
    opts = opts || {};
    var hello = body.querySelector(".tutor-hello");
    if (hello) hello.remove();
    var wrap = document.createElement("div");
    wrap.className = "tutor-turn";
    if (q.id) wrap.setAttribute("data-q", q.id);
    wrap.innerHTML =
      (q.quote ? '<div class="tutor-cite"><q>' + esc(q.quote.length > 180 ? q.quote.slice(0, 180) + "…" : q.quote) + "</q>" +
        (q.sectionId ? '<a href="#' + esc(q.sectionId) + '" class="tutor-jump">Show in lesson</a>' : "") + "</div>" : "") +
      '<div class="bubble me">' + esc(q.question) + "</div>" +
      '<div class="bubble bot">' + (answerHtml || '<span class="typing"><i></i><i></i><i></i></span>') + "</div>";
    body.appendChild(wrap);
    var jump = wrap.querySelector(".tutor-jump");
    if (jump) jump.addEventListener("click", function (e) {
      e.preventDefault();
      var m = document.querySelector('mark.asked[data-q="' + q.id + '"]') || document.getElementById(q.sectionId);
      if (m) { m.scrollIntoView({ block: "center" }); if (m.classList) { m.classList.add("flash"); setTimeout(function () { m.classList.remove("flash"); }, 1600); } }
      if (innerWidth < 640) closePanel();
    });
    if (!opts.quiet) scrollBottom();
    return wrap;
  }
  function openPanel() {
    panel.hidden = false;
    document.documentElement.classList.add("tutor-open");
    fab.classList.add("open");
    fab.classList.remove("pulse");
    fab.querySelector(".tutor-dot").hidden = true;
    seenHint("ask");
    renderEmpty();
    setTimeout(function () { input.focus(); scrollBottom(); }, 30);
  }
  function closePanel() { panel.hidden = true; document.documentElement.classList.remove("tutor-open"); fab.classList.remove("open"); }
  fab.addEventListener("click", function () { panel.hidden ? openPanel() : closePanel(); });
  panel.querySelector(".tutor-x").addEventListener("click", closePanel);
  panel.addEventListener("keydown", function (e) { if (e.key === "Escape") closePanel(); });

  // Drag the panel's left edge to resize it. The width is shared by every lesson in this browser.
  var resizer = panel.querySelector(".tutor-resize");
  var widthKey = "teach:tutor-width";
  function setWidth(w, save) {
    var max = Math.max(320, Math.min(900, innerWidth - 420));
    w = Math.round(Math.min(max, Math.max(320, w)));
    document.documentElement.style.setProperty("--tutor-w", w + "px");
    resizer.setAttribute("aria-valuenow", w);
    if (save) { try { localStorage.setItem(widthKey, w); } catch (e) {} }
  }
  function savedWidth() { try { return +localStorage.getItem(widthKey) || 0; } catch (e) { return 0; } }
  if (savedWidth()) setWidth(savedWidth());
  addEventListener("resize", function () { if (savedWidth()) setWidth(savedWidth()); });
  resizer.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    resizer.setPointerCapture(e.pointerId);
    document.documentElement.classList.add("tutor-resizing");
  });
  resizer.addEventListener("pointermove", function (e) {
    if (resizer.hasPointerCapture(e.pointerId)) setWidth(innerWidth - e.clientX);
  });
  function endResize(e) {
    if (!resizer.hasPointerCapture(e.pointerId)) return;
    resizer.releasePointerCapture(e.pointerId);
    document.documentElement.classList.remove("tutor-resizing");
    setWidth(panel.offsetWidth, true);
  }
  resizer.addEventListener("pointerup", endResize);
  resizer.addEventListener("pointercancel", endResize);
  resizer.addEventListener("dblclick", function () {
    document.documentElement.style.removeProperty("--tutor-w");
    try { localStorage.removeItem(widthKey); } catch (e) {}
  });
  resizer.addEventListener("keydown", function (e) {
    var step = e.shiftKey ? 80 : 20;
    if (e.key === "ArrowLeft") { e.preventDefault(); setWidth(panel.offsetWidth + step, true); }
    if (e.key === "ArrowRight") { e.preventDefault(); setWidth(panel.offsetWidth - step, true); }
  });

  function setQuote(p) {
    pendingQuote = p;
    quoteBox.hidden = !p;
    if (p) quoteBox.querySelector("q").textContent = p.text.length > 160 ? p.text.slice(0, 160) + "…" : p.text;
  }
  quoteBox.querySelector("button").addEventListener("click", function () { setQuote(null); });

  function api(method, url, data) {
    return fetch(url, { method: method, headers: { "Content-Type": "application/json", "X-Teach": "1" }, body: data ? JSON.stringify(data) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Something went wrong."); return j; }); });
  }
  function saveLocal() { try { localStorage.setItem(localKey, JSON.stringify(thread)); } catch (e) {} }

  function send(text) {
    var question = String(text || "").trim();
    if (!question || waiting) return;
    var p = pendingQuote;
    var q = { question: question, quote: p ? p.text : "", section: p ? p.section : "", sectionId: p ? p.sectionId : "" };
    input.value = "";
    autosize();
    setQuote(null);
    if (!chatLive) {
      var prompt = 'Question about my GrowthX teach lesson "' + plain(meta.title || "") + '"' + (q.section ? " (section: " + q.section + ")" : "") + "\n\n" +
        (q.quote ? "About this part:\n> " + q.quote + "\n\n" : "") + "My question: " + question;
      q.id = "l" + Date.now().toString(36);
      thread.push(q);
      saveLocal();
      if (p) markPassage(p, q.id);
      addTurn(q, "<p>Your question is copied. Paste it into your AI chat for an explanation.</p>");
      copy(prompt, null);
      return;
    }
    waiting = true;
    var turn = addTurn(q, null);
    var history = thread.slice(-3).reduce(function (h, t) { return h.concat([{ role: "user", text: t.question }, { role: "assistant", text: t.answer || "" }]); }, []);
    api("POST", "/api/ask", { lesson: lessonDir, question: question, quote: q.quote, section: q.section, sectionId: q.sectionId, history: history })
      .then(function (entry) {
        thread.push(entry);
        turn.setAttribute("data-q", entry.id);
        turn.querySelector(".bubble.bot").innerHTML = md(entry.answer);
        if (p) markPassage(p, entry.id);
        if (panel.hidden) fab.querySelector(".tutor-dot").hidden = false;
      })
      .catch(function (err) { turn.querySelector(".bubble.bot").innerHTML = '<p class="tutor-err">' + esc(err.message) + "</p>"; })
      .then(function () { waiting = false; scrollBottom(); });
  }
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(200, input.scrollHeight) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); } });
  panel.querySelector(".tutor-form").addEventListener("submit", function (e) { e.preventDefault(); send(input.value); });

  // ---------- asked passages stay marked ----------
  function textNodesIn(root) {
    var out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) { return n.parentElement && n.parentElement.closest("figure, button, .term-tip, script, style") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }
    });
    while (w.nextNode()) out.push(w.currentNode);
    return out;
  }
  // Find the quote inside its section (whitespace-insensitive) and wrap each piece in <mark>.
  function markText(section, quote, id) {
    if (!section || !quote || document.querySelector('mark.asked[data-q="' + id + '"]')) return;
    var nodes = textNodesIn(section), flat = "", map = [];
    nodes.forEach(function (n, ni) {
      for (var i = 0; i < n.nodeValue.length; i++) {
        var ch = n.nodeValue[i];
        if (/\s/.test(ch)) { if (flat.slice(-1) === " ") continue; ch = " "; }
        flat += ch;
        map.push([ni, i]);
      }
    });
    var target = quote.replace(/…$/, "").replace(/\s+/g, " ").trim();
    var at = flat.indexOf(target);
    if (at < 0) return;
    var end = at + target.length - 1, pieces = {};
    for (var k = at; k <= end; k++) {
      var m = map[k];
      pieces[m[0]] = pieces[m[0]] || [m[1], m[1]];
      pieces[m[0]][1] = m[1];
    }
    Object.keys(pieces).sort(function (a, b) { return b - a; }).forEach(function (ni) {
      var n = nodes[ni], r = pieces[ni];
      var mid = n.splitText(r[0]);
      mid.splitText(r[1] - r[0] + 1);
      var mark = document.createElement("mark");
      mark.className = "asked";
      mark.setAttribute("data-q", id);
      mark.title = "You asked about this. Click to see the answer.";
      mid.parentNode.replaceChild(mark, mid);
      mark.appendChild(mid);
      mark.addEventListener("click", function () { openThreadAt(id); });
    });
  }
  function markPassage(p, id) {
    window.getSelection && window.getSelection().removeAllRanges();
    markText(document.getElementById(p.sectionId) || document.querySelector(".content"), p.text, id);
  }
  function openThreadAt(id) {
    openPanel();
    var t = body.querySelector('.tutor-turn[data-q="' + id + '"]');
    if (t) { t.scrollIntoView({ block: "start" }); t.classList.add("flash"); setTimeout(function () { t.classList.remove("flash"); }, 1600); }
  }
  function restore(list) {
    thread = list || [];
    body.innerHTML = "";
    thread.forEach(function (q) {
      addTurn(q, q.answer ? md(q.answer) : "<p>Copied to paste into your AI chat.</p>", { quiet: true });
      if (q.quote) markText(document.getElementById(q.sectionId) || document.querySelector(".content"), q.quote, q.id);
    });
    renderEmpty();
  }

  // Server or file? Load saved questions either way.
  var foot = panel.querySelector("#tutor-foot");
  if (false) {
    fetch("/api/health").then(function (r) { return r.json(); }).then(function (h) {
      chatLive = false;
      foot.textContent = chatLive ? "Answered by Claude on your computer, using this lesson." : "Questions are copied for your AI chat; this page does not generate answers.";
      return chatLive ? api("GET", "/api/questions?lesson=" + encodeURIComponent(lessonDir)).then(function (r) { restore(r.questions); }) : restore(loadLocal());
    }).catch(function () { foot.textContent = "Questions are copied for your AI chat."; restore(loadLocal()); });
  } else {
    foot.textContent = "Questions are copied for your AI chat.";
    restore(loadLocal());
  }
  function loadLocal() { try { return JSON.parse(localStorage.getItem(localKey) || "[]"); } catch (e) { return []; } }

  // ---------- select text → ask ----------
  var pop = document.createElement("div");
  pop.className = "ask-pop";
  pop.hidden = true;
  pop.innerHTML = '<button type="button" data-act="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.4c-.5.4-1.3 0-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="currentColor"/></svg>Ask about this</button><button type="button" data-act="simple">Explain simply</button>';
  document.body.appendChild(pop);
  var picked = null;
  function selectionInLesson() {
    var sel = window.getSelection && window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    var text = sel.toString().replace(/\s+/g, " ").trim();
    if (text.length < 3) return null;
    var node = sel.getRangeAt(0).commonAncestorContainer;
    var el = node.nodeType === 1 ? node : node.parentElement;
    if (!el || !el.closest(".content") || el.closest("textarea, input, button, .options, figure, .tutor, .feedback")) return null;
    var section = el.closest("[data-nav]");
    return {
      text: text.length > 600 ? text.slice(0, 600) + "…" : text,
      section: section ? section.getAttribute("data-nav") : "",
      sectionId: section ? section.id : "",
      rect: sel.getRangeAt(0).getBoundingClientRect()
    };
  }
  function updatePop() {
    picked = selectionInLesson();
    if (!picked) { pop.hidden = true; return; }
    pop.hidden = false;
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, picked.rect.left + picked.rect.width / 2 - w / 2), innerWidth - w - 8);
    var top = picked.rect.top - h - 12;
    pop.classList.toggle("below", top < 64);
    if (top < 64) top = picked.rect.bottom + 12;
    pop.style.left = left + scrollX + "px";
    pop.style.top = top + scrollY + "px";
  }
  document.addEventListener("mouseup", function () { setTimeout(updatePop, 0); });
  document.addEventListener("keyup", function (e) { if (e.shiftKey) updatePop(); });
  document.addEventListener("selectionchange", function () { clearTimeout(updatePop.t); updatePop.t = setTimeout(updatePop, 350); });
  pop.addEventListener("mousedown", function (e) { e.preventDefault(); });
  pop.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || !picked) return;
    var p = picked;
    pop.hidden = true;
    seenHint("ask");
    openPanel();
    setQuote(p);
    if (b.getAttribute("data-act") === "simple") send("Can you explain this part more simply?");
    else input.focus();
  });

  // ---------- reading progress ----------
  var bar = document.getElementById("progress");
  function onScroll() {
    var max = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (max > 0 ? Math.min(100, (scrollY / max) * 100) : 100) + "%";
    updateSidebar();
  }
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();
})();
</script>
<script>(function(){const content=document.querySelector('main.content');if(!content)return;const anchor=content.querySelector('#quiz')||content.querySelector('#share');const shell=document.createElement('div');shell.innerHTML="<section class=\"block\" id=\"business-guide\" data-nav=\"Your six questions\"><div class=\"sec-head\"><span class=\"sec-num\">Reference</span><h2>Your six questions, answered</h2></div><p class=\"muted\">Optional reference guide · researched 23 November 2026. Open any question.</p><details class=\"reference-detail\"><summary>What happens after a customer signs?</summary><div class=\"prose\"><p>The provider helps establish a working security programme. The customer owns decisions and implementation. An appropriate independent assessor examines it when required.</p><ol><li>Confirm what the customer, bank or regulator requires.</li><li>Agree the systems, people, services and data covered.</li><li>Examine current practices and record gaps.</li><li>Assign fixes, owners and dates.</li><li>Implement and collect genuine evidence.</li><li>Review readiness and undergo the applicable assessment.</li><li>Keep checking, updating and improving after the assessment.</li></ol><p><a href=\"https://www.controlcase.com/certifications/pci-dss-certification/\" target=\"_blank\" rel=\"noopener\">ControlCase describes its PCI assessment workflow</a></p></div></details><details class=\"reference-detail\"><summary>How do providers charge in India?</summary><div class=\"prose\"><p>Usually an initial project fee, optional recurring support, and separately identified assessment, software and testing costs. These are examples published by one provider, not India-wide averages or guaranteed quotes. The scope and inclusions differ.</p><div class=\"reference-table\"><table><thead><tr><th>Service</th><th>Published example</th><th>Source</th></tr></thead><tbody><tr><td>ISO 27001</td><td>Consulting ₹1–3 lakh; certification body about ₹0.8–1.2 lakh separately</td><td><a href=\"https://www.tcsa.in/resources/iso-27001-cost-india-2026\" target=\"_blank\" rel=\"noopener\">TCSA ISO cost guide</a></td></tr><tr><td>SOC 2 readiness</td><td>₹2–4 lakh; independent accounting firm fee separate</td><td><a href=\"https://www.tcsa.in/locations/jaipur\" target=\"_blank\" rel=\"noopener\">TCSA scoped readiness pricing</a></td></tr><tr><td>PCI DSS</td><td>Consulting/implementation ₹2–3 lakh; validation ₹1–2 lakh advertised</td><td><a href=\"https://www.tcsa.in/frameworks/pci-dss\" target=\"_blank\" rel=\"noopener\">TCSA PCI offering</a></td></tr><tr><td>DPDP readiness</td><td>₹2–3 lakh, depending on scope</td><td><a href=\"https://www.tcsa.in/pricing\" target=\"_blank\" rel=\"noopener\">TCSA pricing</a></td></tr></tbody></table></div><p>Ask for written quotes. A small merchant outsourcing checkout is a different job from a payment processor. The earlier ₹3 lakh setup and ₹20,000 monthly support were proposed business prices, not established market averages.</p></div></details><details class=\"reference-detail\"><summary>Which providers should I study?</summary><div class=\"prose\"><p>These are examples by role, not a market-share ranking. Check an assessor’s current authorisation before hiring.</p><div class=\"reference-table\"><table><thead><tr><th>Role</th><th>Examples and original sources</th></tr></thead><tbody><tr><td>Enterprise advice</td><td><a href=\"https://www.pwc.in/consulting/risk-consulting/cybersecurity.html\" target=\"_blank\" rel=\"noopener\">PwC India</a></td></tr><tr><td>Payment-security services</td><td><a href=\"https://www.sisainfosec.com/compliance/pci-compliance/\" target=\"_blank\" rel=\"noopener\">SISA</a>; <a href=\"https://www.controlcase.com/certifications/pci-dss-certification/\" target=\"_blank\" rel=\"noopener\">ControlCase</a></td></tr><tr><td>Payment-security assessment business</td><td><a href=\"https://www.sgs.com/en-in/news/2026/01/sgs-expands-digital-trust-leadership-with-acquisition-of-panacea-infosec\" target=\"_blank\" rel=\"noopener\">SGS / Panacea Infosec acquisition, January 2026</a></td></tr><tr><td>ISO certification</td><td><a href=\"https://www.bsigroup.com/en-IN/products-and-services/standards/iso-iec-27001-information-security-management-system/\" target=\"_blank\" rel=\"noopener\">BSI India</a></td></tr><tr><td>Compliance software</td><td><a href=\"https://docs.sprinto.com/getting-started/quickstart\" target=\"_blank\" rel=\"noopener\">Sprinto documentation</a>; <a href=\"https://www.scrut.io/faqs/general\" target=\"_blank\" rel=\"noopener\">Scrut FAQ</a></td></tr></tbody></table></div><p>A software subscription, consulting engagement and independent assessment provide different things. Compare them separately.</p></div></details><details class=\"reference-detail\"><summary>Can Perimattic stamp a PCI certificate?</summary><div class=\"prose\"><p><strong>A branded certificate alone is not recognised proof of PCI DSS compliance.</strong> PCI recognises its official forms, including the Self-Assessment Questionnaire (SAQ), Report on Compliance (ROC), and Attestation of Compliance (AOC). The acquiring bank or payment brand determines the validation route.</p><p>We have not verified Perimattic’s authorisation as a Qualified Security Assessor (QSA) company. A claim of PCI-aware services or hiring a trained person does not establish company authorisation. <a href=\"https://www.pcisecuritystandards.org/assessors_and_solutions/qualified_security_assessors/\" target=\"_blank\" rel=\"noopener\">Check the official company directory</a> and the authorised markets.</p><p>A starting route is to provide readiness and agreed implementation work while an authorised QSA company performs the independent assessment where needed. Keep each party’s responsibilities and independence clear.</p><p>Becoming a QSA company is a separate programme involving company approval, experienced qualified employees, quality assurance, independence, insurance and continued qualification. Do not treat buying a training course as enough.</p><div class=\"reference-table\"><table><thead><tr><th>Published programme item</th><th>Fee in USD</th></tr></thead><tbody><tr><td>Application processing</td><td>$500</td></tr><tr><td>Single Asia-Pacific-country company qualification</td><td>$7,250</td></tr><tr><td>New individual QSA training</td><td>$3,600 per person</td></tr><tr><td>Single-country annual company requalification</td><td>$7,250</td></tr><tr><td>Individual QSA requalification training</td><td>$2,200 per person</td></tr></tbody></table></div><p>India appears in the Asia-Pacific list. These are published fees checked on 23 November 2026, not a full startup budget. Confirm current rules, required staffing, how the application fee is credited, and taxes with PCI SSC. Salaries, insurance, review work, tools and administration are additional.</p><p><a href=\"https://www.pcisecuritystandards.org/faqs/1220/\" target=\"_blank\" rel=\"noopener\">Official certificate FAQ</a> · <a href=\"https://www.pcisecuritystandards.org/qsa_certification/\" target=\"_blank\" rel=\"noopener\">Official training requirements</a> · <a href=\"https://www.pcisecuritystandards.org/program_training_and_qualification/fees/\" target=\"_blank\" rel=\"noopener\">Official fees</a> · <a href=\"https://www.pcisecuritystandards.org/wp-content/uploads/2026/07/Regional-Countriesasof2026.pdf\" target=\"_blank\" rel=\"noopener\">Country list</a></p></div></details><details class=\"reference-detail\"><summary>Which departments does each requirement involve?</summary><div class=\"prose\"><p>The actual coverage depends on the organisation and agreed scope; these are practical examples.</p><div class=\"reference-table\"><table><thead><tr><th>Requirement</th><th>Focus</th><th>Common teams</th></tr></thead><tbody><tr><td>ISO 27001</td><td>Managing information-security risks</td><td>Leadership, IT/security, engineering, HR, procurement, legal, facilities</td></tr><tr><td>SOC 2</td><td>Safeguards supporting a service and selected report criteria</td><td>Engineering, IT/security, operations, HR, suppliers, leadership</td></tr><tr><td>PCI DSS</td><td>Card data and systems that can affect its security</td><td>Payments, engineering, IT/security, operations, procurement</td></tr><tr><td>DPDP</td><td>Handling digital personal information within the law’s scope</td><td>Legal/privacy, product, marketing, HR, support, IT</td></tr><tr><td>GDPR</td><td>Personal-data handling where EU rules apply</td><td>Legal/privacy, product, marketing, HR, support, procurement, IT</td></tr></tbody></table></div><p>Example: HR flags a departure, IT removes access, the manager checks handover, and someone retains the evidence. The work crosses teams because the business process crosses teams.</p><p><a href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO</a> · <a href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">AICPA SOC services</a> · <a href=\"https://www.pcisecuritystandards.org/standards/pci-dss/\" target=\"_blank\" rel=\"noopener\">PCI DSS</a> · <a href=\"https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf\" target=\"_blank\" rel=\"noopener\">Official DPDP Rules</a> · <a href=\"https://commission.europa.eu/law/law-topic/data-protection/data-protection-explained_en\" target=\"_blank\" rel=\"noopener\">European Commission GDPR explanation</a></p></div></details><details class=\"reference-detail\"><summary>Which five should Perimattic prioritise?</summary><div class=\"prose\"><p><strong>No comparable India-wide popularity ranking was established.</strong> Laws, ISO certificates and SOC reports have different populations and counts. The following is a suggested starting order for software and IT-services clients, not a statistical ranking:</p><ol><li>ISO 27001 readiness: a broad security-management starting point.</li><li>SOC 2 readiness: for customers requesting this independent report.</li><li>DPDP readiness: Indian personal-data duties, with staged commencement.</li><li>GDPR readiness: where the customer’s activities fall within EU rules.</li><li>PCI DSS readiness: specialist work for payment-related customers.</li></ol><p>For a payments-focused customer base, PCI may come first. ISO 27001 leads to an independent certificate; SOC 2 to an independent accounting firm’s report; privacy laws create ongoing duties. They are not interchangeable badges.</p><p><a href=\"https://www.iso.org/certification.html\" target=\"_blank\" rel=\"noopener\">ISO certification explanation</a> · <a href=\"https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services\" target=\"_blank\" rel=\"noopener\">AICPA SOC services</a> · <a href=\"https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf\" target=\"_blank\" rel=\"noopener\">DPDP Rules</a></p></div></details></section><section class=\"block\" id=\"sources\" data-nav=\"Linked sources\"><div class=\"sec-head\"><span class=\"sec-num\">Read</span><h2>Original sources</h2></div><p>Official documents establish requirements. Vendor pages describe their own services and prices. Tara Tickets is fictional.</p><ol><li id=\"source-0\"><a href=\"https://www.pcisecuritystandards.org/standards/pci-dss/\" target=\"_blank\" rel=\"noopener\">PCI DSS: scope and requirements</a></li><li id=\"source-1\"><a href=\"https://www.iso.org/standard/27001\" target=\"_blank\" rel=\"noopener\">ISO/IEC 27001: managing information security</a></li><li id=\"source-2\"><a href=\"https://www.controlcase.com/certifications/pci-dss-certification/\" target=\"_blank\" rel=\"noopener\">ControlCase: PCI assessment process</a></li><li id=\"source-3\"><a href=\"https://www.pcisecuritystandards.org/faqs/1220/\" target=\"_blank\" rel=\"noopener\">PCI Council: recognised validation documents</a></li><li id=\"source-4\"><a href=\"https://www.scrut.io/faqs/general\" target=\"_blank\" rel=\"noopener\">Scrut: evidence, controls and workflows</a></li><li id=\"source-5\"><a href=\"https://docs.sprinto.com/getting-started/quickstart\" target=\"_blank\" rel=\"noopener\">Sprinto: getting started with evidence automation</a></li></ol></section>";while(shell.firstChild)content.insertBefore(shell.firstChild,anchor);const side=document.querySelector('#sidebar ol');if(side){for(const item of [['business-guide','Your six questions'],['sources','Linked sources']]){const li=document.createElement('li');const link=document.createElement('a');link.href='#'+item[0];link.textContent=item[1];li.appendChild(link);side.appendChild(li);}}const refs=[{"id":"data-scope","refs":[0]},{"id":"security-controls","refs":[1]},{"id":"audit-evidence","refs":[2,3]},{"id":"workflow-automation","refs":[4,5]}];const src=[{"title":"PCI DSS: scope and requirements","url":"https://www.pcisecuritystandards.org/standards/pci-dss/"},{"title":"ISO/IEC 27001: managing information security","url":"https://www.iso.org/standard/27001"},{"title":"ControlCase: PCI assessment process","url":"https://www.controlcase.com/certifications/pci-dss-certification/"},{"title":"PCI Council: recognised validation documents","url":"https://www.pcisecuritystandards.org/faqs/1220/"},{"title":"Scrut: evidence, controls and workflows","url":"https://www.scrut.io/faqs/general"},{"title":"Sprinto: getting started with evidence automation","url":"https://docs.sprinto.com/getting-started/quickstart"}];refs.forEach(c=>{const section=document.getElementById('c-'+c.id);if(!section||!c.refs.length)return;const p=document.createElement('p');p.className='concept-sources';p.append('Sources: ');c.refs.forEach((idx,i)=>{const s=typeof idx==='number'?src[idx]:src.find(x=>x.id===idx);if(!s)return;if(i)p.append(' · ');const link=document.createElement('a');link.href=s.url;link.target='_blank';link.rel='noopener';link.textContent=s.title;p.append(link);});section.appendChild(p);});})();</script></body>
